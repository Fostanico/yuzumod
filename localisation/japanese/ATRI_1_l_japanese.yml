 yz_ATRI_start_utopia_plan_desc: "あなたが救いたい世界には、私も含まれる？"
 atri_start_plan_tt: "我々は領土内でエデン計画を実施し、永遠に幸せな地上の楽園を築きます。"
 yz_ATRI_expand_buildings: "地域開発"
 yz_ATRI_expand_buildings_desc: "使えない土地などない。ただ、正しく扱われていない土地があるだけだ。我々は山を削って谷を埋め、砂を固めて海を埋め立て、民生と工業を発展させる。"
