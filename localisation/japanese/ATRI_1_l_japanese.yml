l_japanese:
 ATRI_trait: "高性能ロボット"
 ATRI_trait_desc: "「高性能ですから！（高性能ですから！）」"

 ATRI_get: "未来から来た§4高性能ロボット§!を開発する"
 ATRI_get_desc: "\n§W§9小西久作が開発し、山崎製作所が製造したYHN-04B-009型アンドロイド。§!\n人間の脳と同じ構造を持つバイオニック脳を備え、高い学習能力を持つ。学習を通じて新しい環境に適応し、新しい任務を担う。豊富な感情モジュールを搭載し、人間に近い感情を持ち、§t感情に駆られて命令に背いたり、ロボット三原則に一定程度違反したりすることもある。§! \n暗視機能を備えた高性能電子眼は、視力が普通の人をはるかに上回る。眼球洗浄機能があり、体には痛覚を感じる受容器があるが、炭素繊維の骨格により常人をはるかに超える耐久力を持ち、生活防水レベルを超えて30mの水圧にも耐えられる。\n§Y一般的な家庭用ロボットにはない強力な力を備え§!、指先で精鉄の短剣を曲げられる。元々は他国のスパイとして潜入し任務を遂行する戦闘ロボットだったが、計画失敗後、やむを得ず流浪の身となった。§tロケットパンチ、魚雷コンボパンチ§!などの技も使える。主人が危険にさらされた場合、確かに強力な攻撃能力を発揮する。§!"
 ATRI_warn: "§Y将軍として§4アトリ§!を獲得します \n §!"
 atri_ic: "§W§9寧々§!と§9茉優お姉さん§!に、§Y山崎製作所 - YHN-04B型ロボット§!を改良させる§!"
 atri_ic_desc: "\n§W§9§Y綾地寧々§!と§Y式部茉優§!が小西久作の成果を基に開発し、ゆず工業兵器グループが製造したYHN-0721A型アンドロイド。§!\n人間の脳と同じ構造を持つバイオニック脳を備え、高い学習能力を持つ。学習を通じて新しい環境に適応し、新しい任務を担う。豊富な感情モジュールを搭載し、人間に近い感情を持ち、§t感情に駆られて命令に背いたり、ロボット三原則に一定程度違反したりすることもある。§! \n暗視機能を備えた高性能電子眼は、視力が普通の人をはるかに上回る。眼球洗浄機能があり、体には痛覚を感じる受容器があるが、炭素繊維の骨格により常人をはるかに超える耐久力を持ち、生活防水レベルを超えて30mの水圧にも耐えられる。\n§Y一般的な家庭用ロボットにはない強力な力を備え§!、指先で精鉄の短剣を曲げられる。元々は他国のスパイとして潜入し任務を遂行する戦闘ロボットだったが、計画失敗後、やむを得ず流浪の身となった。§tロケットパンチ、魚雷コンボパンチ§!などの技も使える。主人が危険にさらされた場合、確かに強力な攻撃能力を発揮する。\n§R現在は軍事化改造が施され、この型のロボットの戦闘能力はさらに向上している！§!§!"

 ATRI_equipment: "山崎製作所 - YHN-04B型ロボット"
 ATRI_equipment_0: "山崎製作所 - YHN-04B型ロボット"
 ATRI_equipment_1: "ゆず工業兵器グループ - YHN-0721A型ロボット"
