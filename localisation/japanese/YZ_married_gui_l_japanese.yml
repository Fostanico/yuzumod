 YZ_date_event.47001125: "過去の続編（2）"
 YZ_date_event.47001125.t: "過去の続編（2）"
 YZ_date_event.47001125.d: "夜の後夜祭は相変わらず賑やかだった。夜空の下、皆は焚き火を囲んで、様々な話題で賑やかに語り合っていた。\n\n葵はいつまでもくっついている私たちを見て、困ったように言った。「二人とも、もう全然人目を気にしなくなったわね」「だって今は合法的なんだもん！」佐奈は堂々と答えた。「もう、誰かさんは皆を電球扱いしてるわね…」卯花は一方で、賑やかな人々を微笑みながら眺め、去年とほぼ同じ学園祭の理由をまったく知らないかのようだった。「私の調査によると、後夜祭に一緒に花火を見たカップルの成功率は——」「あ！」「なんと——」「いくら？」「パーセント——」「朋花、まずデータの出所を言いなさい」「コミックマーケット77に掲載された漫画！」\n……相変わらず賑やかだな。\n\n焚き火が燃え、笑い声が夜空に響く。\n佐奈はそっと私の肩に頭を預けた。「去年は、もうこんな景色を見られないと思ってた」彼女はグラウンドの皆を見つめ、満足そうな笑顔を見せた。「でも今は、みんなもいるし、お兄ちゃんもいる。それなら——去年楽しめなかった学園祭、今年は全部取り戻せるね」\n「佐奈、まだやりたいことはあるか？」彼女はすぐには答えず、ただそっと私の手を握った。焚き火が燃え、花火が夜空を照らす。そして、彼女の顔の笑顔は、いつにも増して満ち足りていた。"
 YZ_date_event.47001125.a: "——ただずっと、大好きなあなたのそばにいたかっただけなのです。"
