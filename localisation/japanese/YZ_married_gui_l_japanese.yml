 YZ_date_school_party_event_name_wife_43: "過去の続編（1）"
 YZ_date_school_party_title_wife_43: "過去の続編（1）"
 YZ_date_school_party_desc_wife_43: "水薙学園祭が始まった途端、佐奈は事前に用意したルートマップを持って、私を引っ張ってキャンパスへ飛び込んだ。焼きそばにたこ焼き、クレープにたい焼き——二人で美食が出そうだと思った屋台は、今日すべて計画表に組み込まれていた。\n\n「お兄ちゃん、あーんして」「あー、今日は何回目だ？」「だって美味しいものは、大好きな人と分け合うべきでしょ！」結局、しばらくすると彼女の方が、私が買ったばかりのパンケーキで反撃（お返しの投げ食い）され、真っ赤になって照れていた。\n\nルートマップの最後の駅——佐奈のクラスのお化け屋敷の前。「ようやくここまで来たね」\n佐奈はそっと息を吸って裏方に入っていき、私も来場者たちと一緒に一組分並んで、しばらくしてから入場した。\n不気味で恐ろしい古城の中には、いたるところに罠が仕掛けられている。うっかり作動させると、同級生が演じる幽霊やゾンビが一気に掴みかかり、被害者を閉じ込めてしまう……しまった、もし妹がこの罠の山の中に隠れていたら、どこを探せばいいんだ？まさか一つ一つ試すわけにもいかない——\n「吸血鬼の縄張りへようこそ——永遠にここにいなさい！」\n言い終わるか言い終わらないうちに、彼女は角から飛び出してきた。残念ながら勢い余って足を滑らせ、そのまま、可愛い妹にメロメロになって列から脱落した私の腕の中に、まっすぐ突っ込んできた。その頭突きで二人揃って倒れ込んだ。\n\n周囲が一瞬静かになった。「……」「……」「こ、これは追撃戦術なんだから！」（小声）\n\n佐奈は顔を赤らめて立ち上がり、振り返りもせずに次の組の来場者を追いかけていった。後に残されたのは、同級生たちの抑えきれない小さな笑い声だけ。そして私は脱落者として棺桶に閉じ込められた。だが、小さなツッコミの声が一つ聞こえた。「——ばか（バカ）haruki（春樹）！」「メ、メロメロになったんだから、仕方ないだろ！」"
 YZ_date_school_party_option_wife_43: "英雄は美人の関を越えられず、お前は第二関も越えられない"
