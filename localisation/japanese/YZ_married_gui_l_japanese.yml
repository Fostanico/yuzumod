 YZ_date_shopping_event_name_wife_43: "あなたと一緒に（With You!!）"
 YZ_date_shopping_title_wife_43: "あなたと一緒に（With You!!）"
 YZ_date_shopping_desc_wife_43: "午前中ずっと、私は佐奈に引っ張り回されていた。肩までの金髪をひらひらと揺らしながら人混みを軽やかに縫い、頭の上の可愛らしいお団子も歩調に合わせて揺れ続けている。\n彼女はいつもカップル向けのコーナーに吸い寄せられるように立ち止まる。可愛いインテリア小物を手に取っては眺め、またどこかの新作ポスターを見つめては顔に綺麗な赤みを浮かべ、あの馴染みのある甘えた笑い声をあげる。「ぐへへへへ……」「また変な想像してるだろ？」私は仕方なく手を伸ばして、彼女のふわふわの金髪を揉んだ。「してないもん！私はただ、恋人としての正当な権利を行使してるだけ！」彼女は堂々と言い返し、私の腕を抱く力をさらに強めた。顔はとっくに真っ赤になっている。そんな小手先の言い訳で私を騙せると思うのは、百年早い。\n午後になって、ようやく私がデートの主導権を握る番が来た。「次は俺の番だな」「えー、時間が足りないよ……」「佐奈さん、これから満足させてみせます！」\nまずは皆おすすめのカフェに座って、妹の疲れを癒す。それから商店街をぶらつく。このアクセサリー、似合うな、買おう。このワンピース、うーん……普通だな。次はもっと調査が必要だ……妹をおしゃれに着飾ることに夢中になっているうちに、いつの間にか陽が傾いていた。夕方、私たちは無言のうちに息を合わせ、商店街のランドマークである観覧車へ向かった。\nゴンドラがゆっくりと上昇し、街の喧騒と疲れを外に遮断する。夕陽の余韻がガラス越しに差し込み、彼女の小さな顔を優しいオレンジ色に染めた。\n「兄さん、こうやってずっと一緒にいてくれて、本当に嬉しい」\n佐奈はそっと私の肩に頭を寄せ、可愛い小顔を上に向けて私を見た。まったく、小さな娘だな……いやいや、今はロマンチックなことを言うべきだ——\n「兄さんの広い肩は、夕陽みたいに暖かいね……ふわぁ……」「これからも何度も一緒に見るさ」私は彼女の柔らかい小さな手を握り、暗くなっていく空の下、ゴンドラが止まるまで、妹を幸せな夢に浸らせておいた。彼女の小さな唇が微かに動いている。耳を寄せて聞いてみると——"
 YZ_date_shopping_option_wife_43: "「あなたと一緒にいる時間……私の宝物です」（——『With You!!』）"
