 yuzu_married_dynamic_modifier_desc: "結婚後の日常の触れ合いが、ひそかに国全体に影響を与えつつある。\n\n§Y気分§!は政治力獲得、安定度、生活必需品係数に影響します。\n§Y信頼§!は陸軍組織度、ユニット防御、研究速度、戦争協力度に影響します。\n§Y絆§!は工場生産力、建造速度、生産効率成長に影響します。\n\n気分・信頼・絆は毎週§R-1§!ポイント。§Y30§!ポイント未満になると減少が止まります。戦時支援は毎週§G3§!ポイント回復します。"

