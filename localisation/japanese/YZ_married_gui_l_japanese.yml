 YZ_date_cafe_event_name_wife_43: "新店員？！"
 YZ_date_cafe_title_wife_43: "新店員？！"
 YZ_date_cafe_desc_wife_43: "Robinカフェは珍しく忙しい一日を迎えていた。おじいちゃんと渉姐さんが商店街の花火大会の準備会議に出席するため、人手不足の店には葵しか正社員がいなかった。そこで、葵と渉姐さんの提案で、佐奈も急遽手伝いに駆り出された。\n「なんでこんなのがあるんだ……」着替え終わって出てきた佐奈を見て、私は一瞬呆けた。黒い半袖ワンピースに白いエプロン、腰の後ろのリボンが動きに合わせて揺れ、独特の白いレースの縁取り。金髪はいつものお団子に結われ、白いニーソックスにマリージェーンシューズ——いつから妹が我が家の店員服を持つようになったんだ！？\n「おじいちゃんが前から用意してくれてたんだよ！」佐奈は得意げにくるっと回った。「どう？」「……悪くない」私はなるべく普段通りの口調を心がけた。「悪くないだけ？」「はいはい、臨時店員さん、まずはトレーの持ち方を覚えましょうね」葵がタイミングよく話題を遮った。私はすぐに氷水を一杯注いで、入口近くの席に座り、窓の外を見て気持ちを落ち着けた。\n「わひゃ——」（激しい物音）本当に大丈夫か……\nそんな不安を抱えつつ、水を飲み終えた私は時間通りに店の看板を出した。その後、佐奈は意外なほど優秀に働いた。何しろ家事は元々彼女の得意分野だ。葵の簡単な説明だけで、調理補助も配膳も板についていた。唯一の問題は、仕事中に無意識にこっちを見てくることだった。\n「佐奈、これ三番テーブルに」「はーい！」「佐奈、コーヒー（泡）できたよ」「い、今行きます！」「佐奈、ぼーっとしない」「してないもん！」\nそんな忙しさの中で、店の新旧の常連客も次々とやって来た。「おや？今日は見慣れない顔だね……」「店主の孫娘さんと孫息子さんがお店を手伝ってるのかい？」数人の常連客は笑って頷きながらも、その目線は私と佐奈の間でしばらく留まった。いつもと同じなのに、何か気づかれたような気がする。\n営業のひと段落がつき、佐奈はようやくほっと息をついて、カウンターの後ろに座った。「疲れた……」「お疲れさま」私は冷えたブレンドコーヒーを一杯、彼女の前に滑らせた。佐奈はカップを両手で持ち、一口飲んで、満足そうな笑顔を見せた。カウンター越しに見えるのは、見慣れた机、見慣れたメニュー、見慣れたコーヒーの香り。すべてがいつもと変わらない。「お兄ちゃん」「うん？」「なんか、今日のお手伝いは、いつもより楽しかったよ」\nかもしれない。何しろ、ある臨時店員にとって、今日は初めてカウンターのこちら側に立った日なのだから。"
 YZ_date_cafe_option_wife_43: "それと、今日の売上、なんでこんなに多いの！？"
