#婚礼决议
 believity_icon_tooltip: "§Y信頼§!\n「あ、あなた後悔しても知らないわよ！後で胸が小さくて文句言われても、こ、この店は解約を受け付けませんからね！」\n——三司あやせ\n\n信頼1につき：\n陸軍組織度：§G+0.06%§!\nユニット防御：§G+0.12%§!\n研究速度：§G+0.12%§!\n戦争協力度：§G+0.12%§!\n\n100ポイント時、それぞれ§G+6%§!、§G+12%§!、§G+12%§!、§G+12%§!。\n信頼が30ポイント以上になると、毎週§R-1§!。"
 believity_value_tooltip: "信頼：[?value_of_believity|0]/100"
 change_clothes_buttom_tooltip: "§Y立ち絵を切り替え§!\nクリックで次のキャラクター立ち絵を表示\n現在の立ち絵：[?number_of_portrait|0]/[?number_of_portrait_max|0]"
 character_bac_tooltip: "§Y現在のキャラクター立ち絵：[?number_of_portrait|0]/16§!"
 character_sd_tooltip: "§YSDとメッセージを切り替え§!\nクリックで次のSDを表示\n現在のSD：[?number_of_sd|0]/[?number_of_sd_max|0]"
 character_sd_message_text: "[YZ_married_sd_message]"
 YZ_married_sd_message_default: "【記入してください：デフォルトの結婚後メッセージ】"
 YZ_married_sd_message_43_1: "「で、でも、あなたがそこまで言うなら、私が結婚してあげてもいいわよ？どうせ、お兄ちゃんみたいなダメ人間を引き取ってくれるのは、私だけなんだから」"
 YZ_married_sd_message_43_2: "「ひゃ、ひゃああ！ど、どうしたの？」"
 YZ_married_sd_message_43_3: "「大切な妹、ね。ふふふふふ……」\n「でも……まさか、私のことをただの妹としか見てないの？　それなら、それで、とってもまずいことなのよ……」"
 YZ_married_sd_message_43_4: "「あ、べ、別に深い意味はないんだからね！ただ、妹として、お兄ちゃんの彼女になる人って、やっぱりちゃんと知っておかなきゃって思っただけなんだから！」"
 YZ_married_sd_message_43_5: "「違うもん！お兄ちゃん……お兄ちゃんみたいな人の妹は、絶対に殿堂級なんだから！妹は正義！」"
 YZ_married_sd_message_43_6: "「ただのシスコンでしょ！シスコンは変態じゃない、シスコンは正義！」"
 YZ_married_sd_message_43_7: "「えへ、えへへへ……お、お兄ちゃんからのプレゼント。ブローチのプレゼント……」"
 date_bac_tooltip: "§9デート§!\n§Y150§!政治力を支払い、£GFX_yz_money §Y600§!柚子コインで、五つのデートシチュエーションから一つ選びます。\nデートは気分・信頼・絆を大きく上昇させます。すべてのデートは約§Y90日§!の共通クールダウンを共有し、週単位で決済されます。一度に選べるのは一つだけです。\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 date_buttom_left_one_tooltip: "§9ビーチ§!\n\n\n\n\n\n£date_beach\n\n\n\n\n\n\n海風と波の音を友に、彼女とのんびりした一日を過ごす。\n\n消費：£GFX_pol_power §Y150§!政治力\n支出：£GFX_yz_money 600柚子コイン\n気分：§G+24§!  信頼：§G+15§!  絆：§G+18§!\nデートのクールダウン：[?yuzu_married_date_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 date_buttom_left_two_tooltip: "§9ショッピング街§!\n\n\n\n\n\n£date_shopping\n\n\n\n\n\n\n賑やかな街をぶらつき、お互いが好きになる新しい何かを見つけるかもしれない。\n\n消費：£GFX_pol_power §Y150§!政治力\n支出：£GFX_yz_money 600柚子コイン\n気分：§G+18§!  信頼：§G+22§!  絆：§G+16§!\nデートのクールダウン：[?yuzu_married_date_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 date_buttom_middle_tooltip: "§9学園祭§!\n\n\n\n\n\n£date_school_party\n\n\n\n\n\n\n賑やかな学園祭を一緒に歩き、二人だけの思い出を作る。\n\n消費：£GFX_pol_power §Y150§!政治力\n支出：£GFX_yz_money 600柚子コイン\n気分：§G+16§!  信頼：§G+24§!  絆：§G+20§!\nデートのクールダウン：[?yuzu_married_date_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 date_buttom_right_one_tooltip: "§9カフェ§!\n\n\n\n\n\n£date_cafe\n\n\n\n\n\n\n静かな席を見つけて、コーヒーの香りの中でゆっくり話す。\n\n消費：£GFX_pol_power §Y150§!政治力\n支出：£GFX_yz_money 600柚子コイン\n気分：§G+20§!  信頼：§G+18§!  絆：§G+23§!\nデートのクールダウン：[?yuzu_married_date_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 date_buttom_right_two_tooltip: "§9遠出§!\n\n\n\n\n\n£date_jounery\n\n\n\n\n\n\n慣れた日常を一時離れて、彼女ともっと遠くの景色を見に行く。\n\n消費：£GFX_pol_power §Y150§!政治力\n支出：£GFX_yz_money 600柚子コイン\n気分：§G+23§!  信頼：§G+21§!  絆：§G+25§!\nデートのクールダウン：[?yuzu_married_date_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 gift_bac_tooltip: "§C贈り物§!\n柚子コインでアクセサリー、化粧品、ぬいぐるみを買って彼女に贈り、気分・信頼・絆を上げます。\n三種類の贈り物は価格と報酬が異なり、それぞれ約§Y90日§!の独立したクールダウンを週単位で持ちます。\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 gift_buttom_left_tooltip: "§Cアクセサリーを贈る§!\n支出：£GFX_yz_money 500柚子コイン\n気分：§G+5§!\n信頼：§G+3§!\n絆：§G+3§!\nクールダウン進捗：[?married_gift_accessory_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 gift_buttom_middle_tooltip: "§C化粧品を贈る§!\n支出：£GFX_yz_money 1000柚子コイン\n気分：§G+9§!\n信頼：§G+4§!\n絆：§G+5§!\nクールダウン進捗：[?married_gift_cosmetics_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 gift_buttom_right_tooltip: "§Cぬいぐるみを贈る§!\n支出：£GFX_yz_money 750柚子コイン\n気分：§G+5§!\n信頼：§G+5§!\n絆：§G+5§!\nクールダウン進捗：[?married_gift_doll_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 help_bac_tooltip: "§1戦時支援§!\n戦時支援と少量の気分・信頼・絆を消費し、協力計画、後方支援、または生産調整の期間限定国家ボーナスを獲得します。\n同じ支援は、効果が終了するまで再び有効化できません。\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 help_buttom_left_tooltip: "§1協力計画§!\n消費：戦時支援§Y18§!、気分§R4§!、信頼§R3§!、絆§R3§!\n§Y結婚後生活§!に約§Y45§!日の効果を追加：\n政治力獲得：§G+18%§!\n安定度：§G+4.5%§!\n計画速度：§G+18%§!\n現在の残り時間：[?yuzu_married_assistance_days|0]日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 help_buttom_middle_tooltip: "§1後方支援§!\n消費：戦時支援§Y23§!、気分§R3§!、信頼§R5§!、絆§R4§!\n§Y結婚後生活§!に約§Y30§!日の効果を追加：\n補給消費：§G-18%§!\n消耗：§G-12%§!\n陸軍速度：§G+12%§!\n現在の残り時間：[?yuzu_married_logistics_days|0]日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 help_buttom_right_tooltip: "§1生産調整§!\n消費：戦時支援§Y28§!、気分§R5§!、信頼§R4§!、絆§R6§!\n§Y結婚後生活§!に約§Y45§!日の効果を追加：\n工場生産力：§G+12%§!\n生産効率成長：§G+18%§!\n建造速度：§G+12%§!\n現在の残り時間：[?yuzu_married_production_days|0]日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 help_icon_tooltip: "§Y戦時支援§!\n「黒い翼は、私の幸せの証。あなたと私の絆の証なの」\n——白雪乃愛\n\n彼女が戦争や国家の事務において提供できる追加の支援を表します。（codex残り枠）\n\n戦時支援自体は常駐修正を直接提供せず、三つの期間限定支援効果を起動するために使われます。\n毎週§G3§!ポイント回復、最大100ポイント。"
 help_value_tooltip: "戦時支援：[?value_of_help|0]/100"
 interact_bac_tooltip: "§7日常交流§!\n政治力を消費して、キス、一緒に勉強、または一緒に遊ぶことで、気分・信頼・絆を変化させます。\n一緒に勉強は少量の気分を消費しますが、期間限定の研究・政治力・工場生産力ボーナスを提供します。三種類の交流はそれぞれ約§Y90日§!の独立したクールダウンを週単位で持ちます。\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 interact_buttom_left_tooltip: "§7キス§!\n消費：£GFX_pol_power §Y100§!政治力\n気分：§G+9§!\n信頼：§G+3§!\n絆：§G+5§!\nクールダウン進捗：[?married_interact_kiss_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 interact_buttom_middle_tooltip: "§7一緒に勉強§!\n消費：£GFX_pol_power §Y150§!政治力\n気分：§R-2§!\n信頼：§G+11§!\n絆：§G+10§!\n約§Y45§!日の間：研究速度§G+5%§!、政治力獲得§G+5%§!、工場生産力§G+3%§!\n現在のボーナス残り時間：[?yuzu_married_study_days|0]日（週単位決済）\nクールダウン進捗：[?married_interact_study_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 interact_buttom_right_tooltip: "§7一緒に遊ぶ§!\n消費：£GFX_pol_power §Y125§!政治力\n気分：§G+7§!\n信頼：§G+4§!\n絆：§G+7§!\nクールダウン進捗：[?married_interact_play_cooldown|0]/90日（週単位決済）\n\n§Y計時について：§!計算リソース節約のため、結婚後システムは週単位でカウントします。実際の効果・クールダウンの日数は、画面表示の値と完全には一致しない場合があります。効果時間に問題が生じるかもしれませんが、ご容赦ください。"
 loving_icon_tooltip: "§Y気分§!\n「浮気した回数X14」\n——矢来美羽。ある狼人が小さなロリにキスされた後\n\n気分1につき：\n政治力獲得：§G+0.3%§!\n安定度：§G+0.12%§!\n生活必需品係数：§G-0.1%§!\n\n100ポイント時、それぞれ§G+30%§!、§G+12%§!、§G-10%§!。\n気分が30ポイント以上になると、毎週§R-1§!。"
