 YZ_date_jounery_event_name_wife_43: "【制服借用】"
 YZ_date_jounery_title_wife_43: "【制服借用】"
 YZ_date_jounery_desc_wife_43: "水薙学園の交流学生として、私たち一行は六麓学院での一日の学術交流活動に参加した。卯花と葵はすぐに生徒会と教師たちに連れて行かれて課題研究の話になり、ルリもいつでも美味しい高級食堂に惹きつけられていった。そして私は——\n「なんで俺まで選ばれたんだ……」「お兄ちゃんが優秀だからでしょ？」隣の佐奈がぱちぱちと目を瞬かせ、まったく事情を知らない様子だ。どうやら天の思し召し（神力、たぶんぐるぐるの力）が学校の管理職に降り立ったらしい。\nそして、もっと頭が痛いのは別のことだった。キャンパスライフを体験するため、六麓学院は制服の借用イベントを用意していた。今、私の前に立っている佐奈は、もうここの制服に着替えていた。紺色のプリーツスカート、白いトップスに金縁のブレザーに包まれた青いニット、白いニーソックス。彼女の大好きなマリージェーンシューズ以外は、見慣れた水薙学園の制服とはまったく違う。金髪はいつものお団子だけど、青い瞳が慣れない装いのせいでひときわ眩しく見える——制服が変わっただけなのに、どうして目が離せないんだ？「ど、どうかな？」「似合ってるよ」「んふ～」彼女は平静を装って背を向けたが、耳の先はこっそり赤くなっていた。\n校舎を出た後、私たちは並木道をゆっくり散歩した。遠くには噴水と庭園、古典様式の校舎が陽光の下でおとぎ話の城のように見える。「お姫様が住んでそうな場所だね」佐奈は遠くを見つめて、小さく感嘆した。「じゃあ、お前がお姫様じゃないか？」「え？」「だって、似合ってるから」彼女は一瞬呆けて、それから嬉しそうな笑顔を見せた。「じゃあ、お兄ちゃんは？」\n「お姫様の隣には王子様がいるもんな」「兄さん、バカ」口ではそう言いながらも、彼女はそっと私の腕を取った。\n......\n帰りの列車がゆっくりと駅を出発し、夕陽が窓から差し込む。佐奈は窓の外を流れる景色を見つめ、ふと私の肩に頭を預けた。「今日は本当に夢みたいだね」「こんな日は、これからもたくさんあるさ」\n彼女は私の差し出す手のひらに頭をこすりつけ、満足そうに目を閉じた。「うん」「だって、どこにいても——」\n「お兄ちゃんは、私の一番大切な王子様だから」"
 YZ_date_jounery_option_wife_43: "そして、あなたに包まれる日々が幸せです\nあなたに包まれながら過ごす日々が、幸せです"
