 relationship_icon_tooltip: "§Y絆§!\n「大嘘つき……私のこと好きになるって言ったのに、出会えば好きになるって言ったのに」\n——綾地寧々\n\n絆1につき：\n工場生産力：§G+0.18%§!\n建造速度：§G+0.12%§!\n生産効率成長：§G+0.09%§!\n\n100ポイント時、それぞれ§G+18%§!、§G+12%§!、§G+9%§!。\n絆が30ポイント以上になると、毎週§R-1§!。"
