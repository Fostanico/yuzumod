 yuzu_form_yuzu_fans_land_decision_category_desc: "§CYouth United Zone for Universal Synergy of Original Folklore & Traditions§!、\nすなわち世界青年ゆず文化革新共同体は、元気な若者たちが集まり、ゆずソフトの素晴らしさを新たな形で楽しむための組織である！\n我々の先進文化は、§R従属国§!を柚子厨で満ちた§C柚子厨の国§!へと変えられる。ゆず文化を広めるための出費を抑えるべく、クラウドドライブから「ゆずソフト四大名作」をダウンロードできる。ただし某クラウドの速度では少々時間がかかり、§Rゆずクラウド・スーパー会員がいれば大幅に短縮できる§!。\nまた、ゆず文化の普及にはゆず金が必要だ。現在の残高は[?Yuzu_fund|.0+Y]ゆず金である。"
