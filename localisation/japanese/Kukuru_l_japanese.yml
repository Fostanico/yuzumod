 #事件
 kkr_event.1.t: "くくるの到来"
 kkr_event.1.d: "別の世界線では、くくるは自動人形研究で行き詰まり、長い間突破口を見出せずにいた。高校卒業が近づく頃、やがて小七も彼女のもとを去っていった。ある夜、また実験が失敗した後、くくるは静かにモンステラの電源を落とし、冷たくがらんとした実験室を見つめた。彼女はモバイルハードディスクにすべての実験データを持ち出し、実験室のAIが冷たい声で最後の別れを告げた後、くくるは学校の屋上へと向かった。半生の理想と、自身の存在のすべてを胸に抱えて。五号が駆けつける前に、彼女は桜元学園に最後の別れを告げ、そして飛び降りた。しかし彼女を待っていたのは粉々になる痛みではなかった。幾筋もの眩しい白光が、彼女に目を開けさせた。\n「早く、この子はまだ生きてる！」制服を着た数人の男たちが、すぐに彼女を病院へ運んだ。病院で、くくるは古びた病室を見渡し、看護師に思わず尋ねた。「今は何年ですか？」看護師は答えた。「1936年ですけど、どうかしましたか？」「1936年？私、タイムスリップしたの？」くくるは心の中でそう思わずにはいられなかった。「昨夜の私は死んでいるはず……これは神様がくれた二度目のチャンス？」そう考えたくくるは、もう迷っている暇はなかった。持ち歩いていたスーパーAIの助けを借りて、彼女は素早く病院を抜け出し、現地の科学院に紛れ込み、偽造した身分で科学研究を行い、見事に注目を集めた。"
 kkr_event.1.a: "ようこそ、ようこそ"
 kkr_event.2.t: "自動人形研究プロジェクト"
 kkr_event.2.d: "しばらく交流した後、くくるは自動人形プロジェクト「モンステラ」のことを明かし、支援を求めてきた。これは国全体に大きな利益をもたらすが、この追加の研究プロジェクトを始めるにはそれ相応の負担が生じる。承諾すべきだろうか？"
 kkr_event.2.a: "好きなようにやらせよう。面白いプロジェクトだ"
 get_4kkr_scis: "§Yくくる科学者§!を獲得！"
 kkr_event.2.b: "今はそんな余裕はない"
 refuse_kkr_sci: "くくるは説得を続けようとするだろう。断り続けると、くくるは§t去ってしまうかもしれない！§!"
 kkr_event.3.t: "自動人形プロジェクト準備完了"
 kkr_event.3.d: "「基礎的な実験環境は整った。前提技術も未来のデータベースのおかげで速やかに再現できた。さあ、すべてを最初からやり直そう」そう言って、くくるはパソコンの前に座り、前世で胸にしっかりと抱えていたモバイルハードディスクを接続した。前回の研究の詳細が次々と脳裏に浮かんでくる。「今回はこそ、AIに本当の『心』を持たせて、永遠の家族にするんだ」"
 kkr_event.3.a: "研究を開始"
 kkr_event.4.t: "素体準備完了"
 kkr_event.4.d: "（空）"
 kkr_event.4.a: "そんなに触り心地がいいのか……"
 kkr_event.5.t: "AIモデル構築成功"
 kkr_event.5.d: "（テキスト未定）"
 kkr_event.5.a: "成功に一歩近づいた"
 kkr_event.6.t: "研究の停滞"
 kkr_event.6.d: "……\n「その反応は適切だ。さっきの言葉は自己紹介とは言えない」\n「あれはデータベースの知識を語っているだけだ。そこには人間の主観も感情も一切含まれていない」\n「彼女には、人を人たらしめる『魂』と、それに伴う『心』が欠けている」\n「心をどうやって模擬するか、我々にはまったく見当がつかない」\n……\n「最後に、あなたに手伝ってほしいことがある」\n「AIに、あなたのところで性欲というものを学ばせたい」\n「……何て言った？」\n「AIを進化させるために、性欲の学習をさせたいんだ」\n「人間の根本を支える三大欲求、すなわち食欲、睡眠欲、性欲」\n「従来の自動人形にはこの三つの機能はなく、わざわざ搭載する理由もなかった。しかし、人間性を再現するなら、欲求は不可欠だ」\n「自動人形に性欲をどうやって学習させるつもりだ」\n「方法はもちろん考えてある。あなたとセックスすればいい」\n……………………え？\n「AIが今必要としているのは知識ではなく、実践を通じて得る感情だ。そしてその感情をモンステラに伝えるために、私は自分の体内にマイクロチップを埋め込んだ」\n……\n「くくるの感情をAIに使うなら、功利的な性欲よりも、恋愛感情を伴わせた方が妥当だ」\n「何も特別なことじゃない。私とデートすればいい」\n……\n「……そう言うなら、うん、その提案を受け入れよう」"
 kkr_event.6.a: "今回もダメだったのか"
 kkr_event.7.t: "デートの試み"
 kkr_event.7.d: "くくるが自ら私の手を握ってきた。\n「どうしたの、デートだから手を繋ぎたいの？」\n「違うの。昔、私がそんな顔をしていたとき、誰かがこんなふうに手を握ってくれたことを思い出して……」\n「そしたら少し楽になったの。でも、ちょっとだけだからね」\n「そんなこと言わないで、ずっと繋いでいたらいいじゃない」\n「調子に乗らないで」\n私はくくるの手を引いて、わざとぶつかってこようとした男をひらりとかわした。\n「さっきから思ってたんだけどさ、くくる、何かつけてない？いい匂いがするんだけど」\n「気づいてくれたんだ。何も言わないから、気づいてないのかと思ってた」\n「デートのときはおしゃれするべきでしょ？だから香水をつけてみたの。どう？息が荒くなって興奮した？もう私のことを欲しくなった？」\n「一歩ずつ進めないかな？」\n「じゃあ、心臓はドキドキしてる？」\n「そりゃあね」\n「香りの効果は絶大。記録しました」\n「デート中にドキドキしたり興奮したりしたら、ちゃんと教えてね。記録するから」\n……\n「あ、料理が来たよ」「え？！ちょっと待って、心の準備がまだ……」\n「わぁ……ん、うぅ……いい匂い……でも研究のためには我慢しなきゃ。うぅ……」\n「はは、研究一筋の君でも、料理の前では意志が揺らぐんだね」\n「だから……でも……うぅ……」\n「この機会に、食欲が満たされた後、どれだけ相手への関心が減るのかを観察できるよ」\n「なるほど、いいこと言うね」\nさっきまで迷っていたのに、食べ始めた途端、頬はたちまちハムスターのように膨らんだ。そんな可愛い姿を見て、私は思わず笑ってしまった。\n「ん……？何笑ってるの？」\n「いや、ただ、こんなに美味しそうに食べる君が可愛いなって」"
 kkr_event.7.a: "君と一緒にやれて、嬉しいよ"
 kkr_event.8.t: "最初の試み"
 kkr_event.8.d: "（空）"
 kkr_event.8.a: "「どうして逃げるように断ったんだ」"
 kkr_event.9.t: "変な知識を学ぶ"
 kkr_event.9.d: "（空）"
 kkr_event.9.a: "変な知識が増えた！"
 kkr_event.10.t: "再挑戦"
 kkr_event.10.d: "（空）"
 kkr_event.10.a: "これが愛なんだ"
 kkr_event.11.t: "旅行"
 kkr_event.11.d: "「どうして私が自動人形を開発しているのか……あなたはもう薄々気づいているかもしれないけど、やっぱり自分の口から話したいの」\n私がうなずくと、くくるはゆっくりと語り始めた。\n「私は昔、すごく両親にべったりな子どもだったの……でも、ある日、私のパパとママは事故に遭って、二度と帰ってこなかった」\n「とても寂しくて、とても悲しかった。しばらくして……私はものすごく憎しみを感じるようになった。私を置いていった両親に腹が立って、こんな思い出を残すくらいなら、いっそ私も連れて行ってほしいとさえ思った」\n「それでも、私は両親を恋しく思ってやまなかった……でも、もう二度と会うことはできなかった」\n「そんなぼんやりした日々の中で、私は自動人形と出会った。人間と違って、自動人形は老いることもなければ、死ぬこともない」\n「だから私は決めたの。もう絶対に私から離れていかない家族を、自分で作ろうって」\n「……それが、あなたが作った自動人形なんだね」\n「そう。私は愛ではなく、欲望のためにモンステラを作った」\n「もしかしたら、そのせいで研究が一向に進まなかったのかもしれない。モンステラに愛してほしいと思いながら、私自身はそれを愛していなかった」\n「感情を持ってほしいと思いながら、ずっと機械としてしか扱っていなかった」\n「でも、あなたに出会って、私は変わった」\n「焦りばかりだった開発が楽しくなって、モンステラの成長を嬉しく思うようにもなった」\n「今のモンステラへの愛は、もしかしたら私の一方通行かもしれない」\n「だから、これからはちゃんと大切にして、いつか誇らしげにみんなに言えるようにしたいの。……感情を持ててよかったって」\n私は、くくるの小さな体をすっぽり包み込むように抱きしめた。\n「……うん、話したらすっきりした。重かったりした？」\n「君のことなら、何でも聞くよ」\n「……知ってる？あなたのおかげで、こんなふうに両親の話ができるようになったの」\n「あなたが私に愛情を注いでくれたから、生きていてよかったって思わずにはいられなかった」\n「正直、もうあなたへの気持ちは固まってるの。普通の男女の恋愛とは少し違うかもしれないけど、ずっとあなたのそばにいたい」\n「あなたは私にとってそんなに大切で……いえ、もしかしたらだからこそ、もっと先の未来を考えるのが怖いのかもしれない」\n「凪……好きよ……私なりの解釈だけどね」"
 kkr_event.11.a: "「好きだよ、たぶん、とても、とても好き」"
 kkr_event.12.t: "倉庫の中のプロポーズ"
 kkr_event.12.d: "「……ねえ、凪、抱きしめてくれる？」\nくくるは少し恥ずかしそうに私の指を握った。その仕草があまりに可愛くて、私はゆっくりと彼女の小さな体を抱きしめた。\n「……昨日も聞こえたと思うけど、私の感情は抑えられているの。これからも、自分の感情が分からなくて、あなたを困らせてしまうかもしれない」\n「私は誰よりも面倒な人間よ。それでも、私と一緒にいてくれる？」\n「そんなの決まってるだろ」\n「えへへ……そう言ってくれるなら、もう迷わなくていいね」\n私はくくるの頭を抱え込んだ。\n「今なら、あの日あなたがした質問に答えられるわ。もう一度、聞いてくれる？」\n低い声が私の耳に届いた。初めて会った日のことを思い出す。猪突猛進だった私が口にした空虚な言葉は、他人に興味のないくくるの心には届かなかった。でも今の彼女なら、全身で私を受け入れてくれる。\n「——夜刀くくる、結婚してくれ」\n「……うん、私もあなたの家族になりたい。何があっても、あなたと一緒にいたい」\nその少し掠れた声は、くくるの精一杯の気持ちを表していた。\n「泣くなよ」\n「プロポーズされるのは想定内よ。私が泣くわけないでしょ。あなたの見間違いよ」\n「（むっ）……今泣くべきなのは、あなたの方よ。あなたの願いが叶ったんだから」"
 kkr_event.12.a: "「好きだ」"
 kkr_event.13.t: "研究完了"
 kkr_event.13.d: "（空）"
 kkr_event.13.a: "（空）"

