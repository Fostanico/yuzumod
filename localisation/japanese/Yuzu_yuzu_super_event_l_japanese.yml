 we_nuke_hoori_close_buttom: "夏草や 兵どもが 夢の跡"
 we_nuke_washizu_close_buttom: "沙羅双樹の花の色、盛者必衰の理をあらはす"
 we_marry_with_kanna_close_buttom: "取次花叢懶回顧、半縁修道半縁君"
 we_marry_with_mako_close_buttom: "知子之好之、雑佩以報之"
 we_marry_with_murasame_close_buttom: "枕前発尽千般願、要休且待青山爛"
 we_marry_with_hazuki_close_buttom: "水面上秤錘浮、直待黄河徹底枯"
 we_marry_with_daozhu_close_buttom: "先の悪が後の悪を導く"
 we_marry_with_scp_close_buttom: "到中流撃水、浪遏飛舟"
 we_marry_with_yoshino_close_buttom: "Ciallo～(∠・ω< )⌒☆"
 we_marry_with_mibu_close_buttom: "勧君莫惜金縷衣、勧君惜取少年時"
 we_marry_with_koharu_close_buttom: "有美一人、清揚婉兮"
 we_marry_with_ruri_close_buttom: "沅有芷兮澧有蘭、思公子兮未敢言"
