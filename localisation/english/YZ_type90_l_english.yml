l_english:
 yz_start_type90_project: "Launch the YIWG Type 90 MBT Program"
 yz_start_type90_project_desc: "Authorize the 721 Research Institute to finalize an independent YIWG Type 90: roughly 50 tonnes, three crew, 1,500 PS, 70 km/h, a 120 mm smoothbore gun, autoloading, and digital night and on-the-move fire control."
 yz_type90_project_unlocked_tt: "Unlocks Special Project: §YYIWG Type 90 Main Battle Tank§!"
 yz_type90_direct_unlock_tt: "Completes the YIWG Type 90 prototype and unlocks its equipment, modules, and tank battalion"
 research_yz_type90: "The YIWG Type 90 special project has been initiated"
 have_takashiro_maya: "Takashiro Maya has been recruited"
 tech_YZ_type90: "YIWG Type 90 Main Battle Tank"
 tech_YZ_type90_desc: "Finalize the 50-tonne YIWG Type 90, unlocking its independent chassis, 120 mm gun, hybrid suspension, composite protection, 1,500 PS powerpack, digital fire control, autoloader, and dedicated battalion."
 sp_land_yz_type_90: "YIWG Type 90 Main Battle Tank"
 sp_land_yz_type_90_desc: "Complete an independent production design built to the public Type 90 baseline: a 50-tonne vehicle, 1,500 PS water-cooled two-stroke ten-cylinder diesel, hybrid hydropneumatic/torsion-bar suspension, 120 mm L/44 smoothbore gun, autoloader, thermal imaging, and sensor-fused digital fire control."
 sp_land_yz_type_90_output: "YIWG Type 90 Production Design"
 yz_sp_tag_type90: "YIWG Type 90 Program"
 yz_type90_armor: "YIWG Type 90 Tank Battalion"
 yz_type90_armor_desc: "An independent armored battalion fully equipped with YIWG Type 90 main battle tanks. It consumes only this mod's Type 90 chassis and has no Millennium Dawn or other mod equipment dependency."
 EQ_MOD_CAT_yz_type90_turret_type_TITLE: "Two-Man Autoloading Turret"
