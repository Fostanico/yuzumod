 EQ_MOD_CAT_yz_type90_armor_type_TITLE: "Composite Armor and Crew Protection"
 EQ_MOD_CAT_yz_type90_engine_type_TITLE: "Mitsubishi 10ZG32WT 1,500 PS Diesel"
 EQ_MOD_CAT_yz_type90_special_module_TITLE: "Digital Fire Control, Thermal Sights, and Autoloader"
