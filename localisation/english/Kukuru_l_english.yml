 #事件
 kkr_event.1.t: "Kukuru's Arrival"
 kkr_event.1.d: "In another timeline, Kukuru hit a dead end in her automaton research, unable to break through for a long time. As high school graduation drew near, Xiaoqi too left her before long. One night, after another failed experiment, Kukuru quietly shut down monstella and stared at the cold, empty laboratory. She carried all the experimental data out on a portable hard drive, and after the laboratory AI bade her a final farewell in its cold voice, Kukuru climbed onto the school rooftop, carrying half a lifetime of ideals and her entire existence. Before Number Five could arrive, she made her last goodbye to Sakuramoto Academy, then leapt. But what greeted her was not the pain of a shattered body — several blinding white lights forced her eyes open.\n\"Quick, this little girl is still alive!\" Several men in uniform immediately rushed her to the hospital. In the hospital, Kukuru looked at the shabby ward and couldn't help asking the nurse, \"What year is it now?\" The nurse replied, \"1936. Why?\" \"1936? I traveled through time?\" Kukuru thought to herself. \"I should have died last night — is this heaven giving me a second chance?\" With that thought, Kukuru stopped hesitating. With the help of the super AI she carried with her, she quickly slipped out of the hospital, blended into the local academy of sciences, and conducted scientific research under a forged identity, successfully attracting attention."
 kkr_event.1.a: "Welcome, welcome"
 kkr_event.2.t: "The Automaton Research Project"
 kkr_event.2.d: "After talking for a while, Kukuru revealed her automaton project, \"Monstella,\" and asked for our support. It would bring enormous benefits to the entire country, but starting this additional research project would add to our burden. Should we agree?"
 kkr_event.2.a: "Let her go all out — it's an interesting project"
 get_4kkr_scis: "Gain §YKukuru as a scientist!§!"
 kkr_event.2.b: "We don't have the spare capacity right now"
 refuse_kkr_sci: "Kukuru will keep trying to convince us. If we keep refusing, she §tmay leave!§!"
 kkr_event.3.t: "Automaton Project Preparations Complete"
 kkr_event.3.d: "\"The basic laboratory environment is ready, and the prerequisite technologies have been quickly replicated using the database from the future. Now let's start everything over.\" With that, Kukuru sat down at the computer and connected the portable hard drive she had clutched tightly to her chest in her previous life. The details of her last research kept surfacing in her mind. \"This time, I will definitely give AI a true 'heart' and make it my eternal family.\""
 kkr_event.3.a: "Begin Research"
 kkr_event.4.t: "Base Body Preparation Complete"
 kkr_event.4.d: "(Empty)"
 kkr_event.4.a: "Is it really that nice to touch..."
 kkr_event.5.t: "AI Model Construction Successful"
 kkr_event.5.d: "(Text to be added)"
 kkr_event.5.a: "One step closer to success"
 kkr_event.6.t: "Research Stalls"
 kkr_event.6.d: "...\n\"That reaction is quite appropriate. What I just said can hardly count as an introduction.\"\n\"It merely recited knowledge from the database. It contains none of a human's subjectivity or emotions.\"\n\"It lacks the 'soul' that makes a person a person, and the 'heart' that comes with it.\"\n\"We have absolutely no idea how to simulate a heart.\"\n...\n\"Finally, there's the part where I'd like your help.\"\n\"I want AI to learn from you what sexual desire is.\"\n\"...What did you say?\"\n\"In order for AI to evolve, I want it to study sexual desire.\"\n\"The three desires that sustain humanity at its core: appetite, sleep, and sexual desire.\"\n\"Previous automatons had none of these three functions, and there was no reason to go out of our way to install them. However, if we are to recreate humanity, desires are indispensable.\"\n\"How do you plan to make an automaton learn sexual desire?\"\n\"I've already thought of a method, of course. All you have to do is have sex with me.\"\n...huh?\n\"What AI needs now is not knowledge, but emotions gained through practice. And to convey those emotions to Monstella, I've implanted a microchip in my own body.\"\n...\n\"If we're collecting Kukuru's emotions for the AI to use, rather than utilitarian sexual desire, it would be more appropriate to include some romantic feelings.\"\n\"Nothing unusual about it. Just let me go on a date with you.\"\n...\n\"...If you put it that way, well, I accept your proposal.\""
 kkr_event.6.a: "Still no luck this time?"
 kkr_event.7.t: "A First Date Attempt"
 kkr_event.7.d: "Kukuru took the initiative to hold my hand.\n\"What, holding my hand because we're on a date?\"\n\"No. I suddenly remembered that when I used to make that face, someone held my hand like this too...\"\n\"And then I felt a little better. But just for a little while.\"\n\"Don't say that — holding hands the whole time would be nice.\"\n\"Don't get cocky.\"\nI pulled Kukuru's hand and dodged a man who was deliberately trying to bump into us.\n\"I've been wondering — Kukuru, did you spray something? You smell really nice.\"\n\"So you noticed. I thought since you weren't saying anything, you hadn't.\"\n\"Shouldn't you dress up for a date? So I tried some perfume. How is it? Is your breathing heavy? Excited? Starting to want me?\"\n\"Can't we take it one step at a time?\"\n\"Then, is your heart racing?\"\n\"Of course it is.\"\n\"The fragrance is effective. Noted.\"\n\"If your heart races or you get excited during the date, be sure to tell me. I need to take notes.\"\n...\n\"Ah, the food's here.\" \"Hey?! Wait, I'm not mentally prepared yet...\"\n\"Wow... mmm, ah... it smells so good... but for the sake of research, I must endure. Waaah...\"\n\"Haha, even you, devoted to research, waver before a meal.\"\n\"So... but... waaah...\"\n\"You can take this chance to see how much less attention you pay to your partner once your appetite is satisfied.\"\n\"You're right. Well said.\"\nShe had been hesitating just moments ago, but the moment she started eating, her cheeks puffed up like a hamster's. Seeing her adorable expression, I couldn't help but laugh.\n\"Mmm...? What are you laughing at?\"\n\"Nothing. It's just — you eat so happily. You're adorable.\""
 kkr_event.7.a: "I'm glad to have you working with me"
 kkr_event.8.t: "First Attempt"
 kkr_event.8.d: "(Empty)"
 kkr_event.8.a: "\"Why did you refuse, as if running away?\""
 kkr_event.9.t: "Learning Strange Knowledge"
 kkr_event.9.d: "(Empty)"
 kkr_event.9.a: "Strange knowledge increased!"
 kkr_event.10.t: "Trying Again"
 kkr_event.10.d: "(Empty)"
 kkr_event.10.a: "So this is what love is"
 kkr_event.11.t: "The Trip"
 kkr_event.11.d: "\"Why did I develop automatons... You may have already sensed it, but I want to tell you myself.\"\nAfter I nodded, Kukuru slowly began to speak.\n\"I used to be a child who was very attached to her parents... But one day, my mom and dad were in an accident and never came back.\"\n\"I felt so lonely, so sad. After a while... I began to feel overwhelming hatred. I was angry at them for leaving me behind. I even thought, rather than leaving me with such memories, why not take me along too.\"\n\"Even so, I still missed them desperately... But we would never have the chance to meet again.\"\n\"And so, drifting through those dazed days, I encountered automatons. Unlike humans, automatons neither age nor die.\"\n\"So I decided to make myself a family member who would never leave me again.\"\n\"...That's the automaton you created, isn't it.\"\n\"Yes. I created Monstella not out of love, but out of desire.\"\n\"Maybe that's why my research never made progress. I wanted Monstella to love me, but I didn't love it myself.\"\n\"I wanted it to have feelings, yet I only ever treated it as a machine.\"\n\"But after meeting you, I changed.\"\n\"Development, once full of impatience, became enjoyable, and I began to feel happy about Monstella's growth.\"\n\"My love for Monstella now might just be one-sided.\"\n\"So I want to cherish it properly from now on, so that one day it can proudly tell everyone... how glad it is to have gained emotions.\"\nI wrapped my arms around Kukuru, as if to completely envelop her small body.\n\"...Mm. Saying it out loud made me feel much better. Did it feel heavy to listen to?\"\n\"I'm willing to listen to anything about you.\"\n\"...You know, thanks to you, I can talk about my parents like this.\"\n\"Because you poured your love into me, I couldn't help but feel how wonderful it is to be alive.\"\n\"To be honest, I'm already certain of my feelings for you. They may be a little different from ordinary romantic feelings between a man and a woman, but I want to stay by your side forever.\"\n\"You are so important to me... No, perhaps precisely because of that, I'm afraid to think about the more distant future.\"\n\"Nagi... I like you... Though I have my own way of putting it.\""
 kkr_event.11.a: "\"I like you — probably, very, very much\""
 kkr_event.12.t: "A Proposal in the Warehouse"
 kkr_event.12.d: "\"...Hey, Nagi, could you hold me?\"\nKukuru timidly took hold of my fingers. Her gesture was so cute that I slowly wrapped my arms around her small body.\n\"...As you heard yesterday, my emotions are suppressed. From now on, I might cause you trouble because I don't understand my own feelings.\"\n\"I'm a more troublesome person than anyone else. Even so, do you still want to be with me?\"\n\"Isn't that obvious?\"\n\"Hehe... If you say so, then I don't need to hesitate anymore.\"\nI pulled Kukuru's head into my embrace.\n\"Now I can answer the question you asked that day. Will you ask me once more?\"\nA low voice reached my ears. I recalled the day we first met. The empty words I'd blurted out in my reckless rush hadn't reached Kukuru, who had no interest in others. But now, she could accept me with her whole heart.\n\"—Yato Kukuru, marry me.\"\n\"...Mm. I want to become your family too. No matter what happens, I want to be with you.\"\nThat slightly hoarse voice represented Kukuru's utmost effort.\n\"Don't cry.\"\n\"Your proposal was to be expected. There's no way I'd cry. You must be seeing things.\"\n\"(Pouting)... The one who should cry now is you. Your wish has come true.\""
 kkr_event.12.a: "\"I love you\""
 kkr_event.13.t: "Research Complete"
 kkr_event.13.d: "(Empty)"
 kkr_event.13.a: "(Empty)"

