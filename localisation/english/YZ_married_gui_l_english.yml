 believity_icon_tooltip: "§YTrust§!\n\"Y-you'd better not regret this! Even if you complain later that my chest is too small, th-this shop does not support cancellations!\"\n— Mitsukasa Ayase\n\nEach point of Trust provides:\nArmy Organization: §G+0.06%§!\nUnit Defense: §G+0.12%§!\nResearch Speed: §G+0.12%§!\nWar Support: §G+0.12%§!\n\nAt 100 points, these become §G+6%§!, §G+12%§!, §G+12%§!, §G+12%§! respectively.\nWhen Trust reaches 30 points or more, it decreases by §R-1§! per week."
 believity_value_tooltip: "Trust: [?value_of_believity|0]/100"
