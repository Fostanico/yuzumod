#专属事件
 YZ_date_event.47001125: "Sequel of the Past (2)"
 YZ_date_event.47001125.t: "Sequel of the Past (2)"
 YZ_date_event.47001125.d: "The after-festival at night was still lively. Under the night sky, everyone gathered around the bonfire, chatting enthusiastically about all sorts of things.\n\nAoi watched the two of us, who kept clinging together, with a helpless look: \"You two are really not avoiding people anymore.\" \"Because we're legally allowed now!\" Sana answered with full confidence. \"Goodness, someone's treating everyone as light bulbs...\" Unohana, meanwhile, smiled at the lively crowd, as if completely unaware of the reason this festival was almost identical to last year's. \"According to my investigation, the success rate of couples who watch fireworks together during the after-festival——\" \"Ah!\" \"reaches as high as——\" \"How much?\" \"per——\" \"Tomoka, state your data source first.\" \"The manga that appeared at Comiket 77!\"\n...Still as lively as ever.\n\nThe bonfire blazed, and laughter echoed under the night sky.\nSana leaned gently against my shoulder. \"Last year, I thought I'd never see a sight like this again.\" She watched everyone on the field and showed a satisfied smile. \"But now, everyone's here, and big bro is here too. That means—— everything I couldn't enjoy at last year's festival, I can make up for completely this year.\"\n\"Sana, is there anything else you want to do?\" She didn't answer immediately, just gently took my hand. The bonfire blazed, and fireworks lit up the night sky. And the smile on her face was more satisfied than ever."
 YZ_date_event.47001125.a: "—I only ever wanted to stay by the side of the one I love most."
