 YZ_date_school_party_desc_wife_43: "The moment Minagi Academy's festival began, Sana grabbed the route map she had prepared in advance and pulled me rushing into the campus. From yakisoba and takoyaki to crepes and taiyaki, every stall the two of us agreed might have good food had been put on today's schedule.\n\nBig bro, open wide—\" \"Ah—how many times is this today?\" \"Because delicious things have to be shared with the one you love most!\" Before long, she herself was counter-fed (stuff-fed) by me with the freshly bought pancake, her face flushed bright red.\n\nThen came the final stop on the route map — the haunted house of Sana's class. \"Finally made it here.\"\nSana took a soft breath and went backstage, while I lined up with the visitors and entered a little later.\nIn the eerie, terrifying castle, traps lay everywhere. Trip one by accident, and ghosts and zombies played by classmates would grab you and lock you away... Oh no — if my little sister was hiding among this pile of traps, where on earth would I find her? I couldn't very well try them one by one——\n\"Welcome to the vampire's domain — stay here forever!\"\nThe moment she finished speaking, she charged out from around the corner. Unfortunately, she rushed too fast, slipped, and tumbled straight into my arms — me, who had fallen behind the group because he was too melted by his cute little sister to move. That headbutt sent us both crashing to the ground.\n\nThe surroundings fell silent for a moment. \"...\" \"...\" \"Th-this is a pursuit tactic!\" (in a small voice)\n\nSana scrambled up, face red, and continued chasing the next batch of visitors without looking back, leaving only the barely suppressed giggles of her classmates behind — while I, eliminated, was locked inside a coffin. But one tiny voice of complaint could be heard: \"—baka (idiot) haruki (Haruki)!\" \"I was... melted by cuteness — what was I supposed to do!\""
 YZ_date_school_party_option_wife_43: "Even heroes fall for beauties — and you can't even pass the second stage"
