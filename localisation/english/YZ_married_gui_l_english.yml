 gift_buttom_right_tooltip: "§CGive Plushie§!\nCost: £GFX_yz_money 750 Yuzu Coins\nMood: §G+5§!\nTrust: §G+5§!\nBond: §G+5§!\nCooldown progress: [?married_gift_doll_cooldown|0]/90 days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 help_bac_tooltip: "§1Wartime Support§!\nSpend wartime support and small amounts of Mood, Trust, and Bond to gain limited-time national bonuses for assistance plans, logistics aid, or coordinated production.\nThe same support cannot be activated again before its effect ends.\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 help_buttom_left_tooltip: "§1Assistance Plan§!\nCost: wartime support §Y18§!, Mood §R4§!, Trust §R3§!, Bond §R3§!\nAdds an effect of about §Y45§! days to §Ypost-marriage life§!:\nPolitical Power Gain: §G+18%§!\nStability: §G+4.5%§!\nPlanning Speed: §G+18%§!\nCurrent remaining time: [?yuzu_married_assistance_days|0] days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 help_buttom_middle_tooltip: "§1Logistics Aid§!\nCost: wartime support §Y23§!, Mood §R3§!, Trust §R5§!, Bond §R4§!\nAdds an effect of about §Y30§! days to §Ypost-marriage life§!:\nSupply Consumption: §G-18%§!\nAttrition: §G-12%§!\nArmy Speed: §G+12%§!\nCurrent remaining time: [?yuzu_married_logistics_days|0] days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 help_buttom_right_tooltip: "§1Coordinated Production§!\nCost: wartime support §Y28§!, Mood §R5§!, Trust §R4§!, Bond §R6§!\nAdds an effect of about §Y45§! days to §Ypost-marriage life§!:\nFactory Output: §G+12%§!\nProduction Efficiency Growth: §G+18%§!\nConstruction Speed: §G+12%§!\nCurrent remaining time: [?yuzu_married_production_days|0] days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 help_icon_tooltip: "§YWartime Support§!\n\"The black wings are proof of my happiness, proof of the bond between you and me.\"\n— Shirayuki Noa\n\nRepresents the extra assistance she can provide in war and state affairs. (codex remaining quota)\n\nWartime support itself does not directly provide a permanent modifier; it is used to activate the three limited-time support effects.\nRecovers §G3§! points per week, up to 100 points."
 help_value_tooltip: "Wartime support: [?value_of_help|0]/100"
 interact_bac_tooltip: "§7Daily Interactions§!\nSpend political power to kiss, study together, or play together, changing Mood, Trust, and Bond.\nStudying together consumes a small amount of Mood but provides limited-time bonuses to research, political power, and factory output; each of the three interactions has its own cooldown of about §Y90 days§!, settled weekly.\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
