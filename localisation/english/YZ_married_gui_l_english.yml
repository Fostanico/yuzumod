 loving_icon_tooltip: "§YMood§!\n\"Cheated fourteen times (X14)\"\n— Yarai Miu, after a certain werewolf was kissed by a little loli\n\nEach point of Mood provides:\nPolitical Power Gain: §G+0.3%§!\nStability: §G+0.12%§!\nConsumer Goods Factor: §G-0.1%§!\n\nAt 100 points, these become §G+30%§!, §G+12%§!, §G-10%§! respectively.\nWhen Mood reaches 30 points or more, it decreases by §R-1§! per week."
