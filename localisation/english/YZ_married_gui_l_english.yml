 character_sd_tooltip: "§YSwitch SD & Message§!\nClick to display the next SD\nCurrent SD: [?number_of_sd|0]/[?number_of_sd_max|0]"
 character_sd_message_text: "[YZ_married_sd_message]"
 YZ_married_sd_message_default: "【Please fill in: default post-marriage message】"
 YZ_married_sd_message_43_1: "\"B-but, if you insist, I could marry you too, you know? After all, a loser like you, big bro — I'm probably the only one who'd take you.\""
 YZ_married_sd_message_43_2: "\"Wha, what?! Wh-what's wrong?\""
 YZ_married_sd_message_43_3: "\"An important little sister, huh. Hehehehehe...\"\n\"But... could it be that you see me only as a little sister? That would be... quite troublesome indeed...\""
 YZ_married_sd_message_43_4: "\"Ah, i-it's nothing special, okay! It's just that, as a little sister, I really ought to learn about the person who's going to be my big brother's girlfriend, after all.\""
 YZ_married_sd_message_43_5: "\"That's not it! Big bro... someone like you — a little sister is definitely top-tier! Little sisters are justice!\""
 YZ_married_sd_message_43_6: "\"You're just a siscon! A siscon isn't a pervert — siscons are justice!\""
 YZ_married_sd_message_43_7: "\"Hehe, hehehe... a g-gift from big bro. A brooch gift......\""
 date_bac_tooltip: "§9Date§!\nPay §Y150§! political power and £GFX_yz_money §Y600§! Yuzu Coins, then choose one of five date scenes.\nDates greatly increase Mood, Trust, and Bond; all dates share a cooldown of about §Y90 days§!, settled weekly, and only one can be chosen at a time.\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 date_buttom_left_one_tooltip: "§9Beach§!\n\n\n\n\n\n£date_beach\n\n\n\n\n\n\nSpend a relaxed day with her, accompanied by sea breeze and the sound of waves.\n\nCost: £GFX_pol_power §Y150§! political power\nSpend: £GFX_yz_money 600 Yuzu Coins\nMood: §G+24§!  Trust: §G+15§!  Bond: §G+18§!\nDate cooldown: [?yuzu_married_date_cooldown|0]/90 days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 date_buttom_left_two_tooltip: "§9Shopping District§!\n\n\n\n\n\n£date_shopping\n\n\n\n\n\n\nStroll through the lively streets — you might discover new things you both like.\n\nCost: £GFX_pol_power §Y150§! political power\nSpend: £GFX_yz_money 600 Yuzu Coins\nMood: §G+18§!  Trust: §G+22§!  Bond: §G+16§!\nDate cooldown: [?yuzu_married_date_cooldown|0]/90 days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 date_buttom_middle_tooltip: "§9School Festival§!\n\n\n\n\n\n£date_school_party\n\n\n\n\n\n\nWalk together through the bustling school festival, leaving memories that belong only to the two of you.\n\nCost: £GFX_pol_power §Y150§! political power\nSpend: £GFX_yz_money 600 Yuzu Coins\nMood: §G+16§!  Trust: §G+24§!  Bond: §G+20§!\nDate cooldown: [?yuzu_married_date_cooldown|0]/90 days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 date_buttom_right_one_tooltip: "§9Café§!\n\n\n\n\n\n£date_cafe\n\n\n\n\n\n\nFind a quiet seat and chat slowly over the aroma of coffee.\n\nCost: £GFX_pol_power §Y150§! political power\nSpend: £GFX_yz_money 600 Yuzu Coins\nMood: §G+20§!  Trust: §G+18§!  Bond: §G+23§!\nDate cooldown: [?yuzu_married_date_cooldown|0]/90 days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 date_buttom_right_two_tooltip: "§9Journey§!\n\n\n\n\n\n£date_jounery\n\n\n\n\n\n\nLeave the familiar routine behind for a while and go see farther scenery with her.\n\nCost: £GFX_pol_power §Y150§! political power\nSpend: £GFX_yz_money 600 Yuzu Coins\nMood: §G+23§!  Trust: §G+21§!  Bond: §G+25§!\nDate cooldown: [?yuzu_married_date_cooldown|0]/90 days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 gift_bac_tooltip: "§CGifts§!\nUse Yuzu Coins to buy accessories, cosmetics, or plushies to give her, increasing Mood, Trust, and Bond.\nThe three gifts differ in price and rewards, and each has its own cooldown of about §Y90 days§!, settled weekly.\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
 gift_buttom_left_tooltip: "§CGive Accessories§!\nCost: £GFX_yz_money 500 Yuzu Coins\nMood: §G+5§!\nTrust: §G+3§!\nBond: §G+3§!\nCooldown progress: [?married_gift_accessory_cooldown|0]/90 days (settled weekly)\n\n§YTiming Note:§! To save computing resources, the post-marriage system counts weekly, so the actual duration or cooldown in days may not exactly match the displayed values. We apologize if this causes any issues with effect durations."
