 YZ_date_jounery_event_name_wife_43: "【Uniform Borrowing】"
 YZ_date_jounery_title_wife_43: "【Uniform Borrowing】"
 YZ_date_jounery_desc_wife_43: "As exchange students of Minagi Academy, our group came to Rokuroku Academy for a one-day academic exchange. Unohana and Aoi were soon pulled away by the student council and teachers to discuss research topics, and Ruri was also drawn away by the always-delicious high-end cafeteria. As for me——\n\"Why was I chosen too...\" \"Isn't big bro just excellent?\" Beside me, Sana blinked, looking completely unaware of the inside story. It seemed some divine will (divine power — probably some guruguru power) had descended upon the school administration.\nWhat troubled me more was another matter. To let us experience campus life, Rokuroku Academy had prepared a uniform borrowing activity. Sana, standing before me now, had already changed into their uniform. A dark blue plaid skirt, a white top and a blue sweater wrapped in a gold-trimmed blazer, white knee-high socks — completely different from the familiar Minagi Academy uniform, except for her favorite Mary Jane shoes. Her golden hair was still in the usual buns, but her blue eyes looked especially dazzling in the unfamiliar outfit — she'd only changed school uniforms, so why couldn't I take my eyes off her? \"H-how is it?\" \"It suits you.\" \"Mm-hm~\" She turned away pretending to be calm, but the tips of her ears had quietly turned red.\nLeaving the school building, we strolled slowly along the tree-lined path. In the distance were fountains and gardens; the classical school buildings looked like a castle from a fairy tale in the sunlight. \"It feels like a place where a princess would live.\" Sana gazed into the distance with a soft sigh. \"Then wouldn't you be the princess?\" \"Huh?\" \"Because it suits you.\" She froze for a moment, then showed a somewhat happy smile. \"And what about big bro?\"\n\"Isn't there supposed to be a prince beside the princess?\" \"Nii-san, you idiot.\" Even as she said that, she gently took my arm.\n......\nThe train home slowly pulled out of the station, and the setting sun streamed through the window. Sana watched the scenery flowing past, then suddenly rested her head on my shoulder. \"Today really felt like a dream.\" \"There will be many more days like this.\"\nShe nuzzled her head gently against my reaching palm and closed her eyes contentedly. \"Mm.\" \"Because no matter where——\"\n\"Big bro is my most important prince.\""
 YZ_date_jounery_option_wife_43: "Soshite, anata ni tsutsumareru hibi ga shiawase desu\nThe days wrapped in your embrace are so happy"
