l_english:
 ATRI_trait: "High-Performance Robot"
 ATRI_trait_desc: "\"I'm high-performance, after all! (Kōseinō desu kara!)\""

 ATRI_get: "Develop a §4High-Performance Robot§! from the Future"
 ATRI_get_desc: "\n§W§9Developed by Konishi Kyuusaku and manufactured by Yamazaki Manufacturing, the YHN-04B-009 android.§!\nIt has a bionic brain with the same structure as a human brain and powerful learning ability, adapting to new environments and taking on new tasks through learning. Equipped with a rich emotion module, it has emotions similar to a human's, §tand driven by emotion, it can disobey orders and even violate the Three Laws of Robotics to a certain extent.§! \nIts high-performance electronic eyes with night vision give it eyesight far beyond ordinary people. It has an eye-cleaning function and pain receptors across its body; however, its carbon-fiber bones allow it to withstand far more than a normal person, and beyond everyday waterproofing, it can endure water pressure of 30 m.\n§YIt possesses strength that ordinary household robots do not have§!, able to bend a fine iron dagger with its fingertips. It was originally a combat robot infiltrating as a foreign spy to carry out a mission, but after the plan failed, it was forced into exile. It also knows skills such as the §trocket punch and torpedo combo punch§!. When its master is in danger, it indeed possesses formidable attack power.§!"
 ATRI_warn: "§YYou will obtain §4Atri§! as a general \n §!"
 atri_ic: "§WHave §9Nene§! and §9Mayu-nee§! improve the §YYamazaki Manufacturing - YHN-04B Robot§!§!"
 atri_ic_desc: "\n§W§9Developed by §YAyachi Nene§! and §YShikibe Mayu§! based on Konishi Kyuusaku's work, the YHN-0721A android manufactured by the Yuzusoft Industrial Arms Group.§!\nIt has a bionic brain with the same structure as a human brain and powerful learning ability, adapting to new environments and taking on new tasks through learning. Equipped with a rich emotion module, it has emotions similar to a human's, §tand driven by emotion, it can disobey orders and even violate the Three Laws of Robotics to a certain extent.§! \nIts high-performance electronic eyes with night vision give it eyesight far beyond ordinary people. It has an eye-cleaning function and pain receptors across its body; however, its carbon-fiber bones allow it to withstand far more than a normal person, and beyond everyday waterproofing, it can endure water pressure of 30 m.\n§YIt possesses strength that ordinary household robots do not have§!, able to bend a fine iron dagger with its fingertips. It was originally a combat robot infiltrating as a foreign spy to carry out a mission, but after the plan failed, it was forced into exile. It also knows skills such as the §trocket punch and torpedo combo punch§!. When its master is in danger, it indeed possesses formidable attack power.\n§RNow militarized, this robot's combat capability has been further enhanced!§!§!"

