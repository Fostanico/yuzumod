 atri_heading_utopia: "Atri's Eden Plan"
 yz_ATRI_start_utopia_plan: "Let's Save the World!"
 yz_ATRI_start_utopia_plan_desc: "Does the world you want to save include me?"
 atri_start_plan_tt: "We will carry out the Eden Plan across our territory, building an eternal paradise on earth where everyone is happy."
 yz_ATRI_expand_buildings: "Regional Development"
 yz_ATRI_expand_buildings_desc: "There is no unusable land — only land that has not been handled properly. We will shave mountains to fill ravines, stabilize sands, and reclaim the sea to develop our people's livelihood and industry."
