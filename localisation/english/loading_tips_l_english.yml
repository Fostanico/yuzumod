l_english:
 LOADING_TIP_0: "I will absolutely never agree to marry you!\n— Yoshino Tomotake"
 LOADING_TIP_1: "Please behold my 0721!\n— Ayachi Nene"
 LOADING_TIP_2: "I'm not afraid of playing galgames. Playing galgames makes me happy. Senren＊Banka doesn't even count.\nIt's just pulling out the Murasame-maru. Sabbat of the Witch — now that's a real playthrough.\nBoth sides meet the parents, can appreciate and critique, and I heard there's even after-stories."
 LOADING_TIP_3: "Ah, senpai! Ciallo~!\n— Inaba Meguru"
 LOADING_TIP_4: "Trash~ trash~ Onii-chan can't even manage basic defense?\n— Tanikaze Amane"
 LOADING_TIP_5: "Go all out, aim high, and play galgames faster, better, and more economically!"
 LOADING_TIP_6: "Yuzu fans are heartless creatures."
 LOADING_TIP_7: "Firm noodles, extra salt, double veggies, extra garlic, heavy oil\n— Ayachi Nene"
 LOADING_TIP_8: "Ouch, ouch, it's gonna get shaved off!\n— Arihara Satoru, while being Riddle Joker'd by Ayase"
 LOADING_TIP_9: "Flat chests are a scarce resource!\n— Mitsukasa Ayase"
 LOADING_TIP_10: "Arihara Nanami? How many detonators does she have!\n— Ayachi Nene"
 LOADING_TIP_11: "Moege is Yuzusoft's greatest hallmark."
 LOADING_TIP_12: "The one true power comes from the detonator.\n— Ayachi Nene"
 LOADING_TIP_13: "Goshujin-sama~\n— Murasame"
 LOADING_TIP_14: "This life's destiny, bound to yours, at that far-off homeland's shore"
 LOADING_TIP_15: "Rather than a 'past' changed by magic,\nI treasure the 'present' far more."
 LOADING_TIP_16: "Flushed cheeks can't hide my yearning —\nI look away, afraid you'll notice."
 LOADING_TIP_17: "Frozen in that barefoot moment, casting all lies and deceit to the sky.\nRed-eyed, tearful, I reached the lakeside of dreams — and tasted love's sweetness for the first time."
 LOADING_TIP_18: "After the curse was lifted, a tiny wish welled up —\nbut that's a maiden's secret, a secret that cannot be told."
 LOADING_TIP_19: "My one wish: to forge destiny, and carve out an infinite future."
 LOADING_TIP_20: "We've had our quarrels, to be sure — but looking back, only the beauty remains."
 LOADING_TIP_21: "Ah, Ayachi Nene is so young —\nThe youthful 0721 one marches forward!\n— Ode to Yuzu"
 LOADING_TIP_22: "Huh? What did you say?"
 LOADING_TIP_23: "Yuzu fans, leave the group chat."
 LOADING_TIP_24: "Yuzu fans, tone it down."
 LOADING_TIP_25: "One, two — pad by pad, a perfect girl emerges!"
 LOADING_TIP_26: "No one may ever know the true size of my boobs. If anyone does, my name is no longer Ayase — you may call me Zero-bust.\n— Mitsukasa Zero-bust"
 LOADING_TIP_27: "Solving others' small worries, bearing destiny's weight on my shoulders"
 LOADING_TIP_28: "Always hiding my secret, keeping others at arm's length —\nthen those ordinary days began to glitter.\nThe scenery you gave me is my SWEET TREASURE."
 LOADING_TIP_29: "Please accept my shūji!\n— Yoshino Tomotake"
 LOADING_TIP_30: "Whether it's a showerhead or a detonator, as long as it works for 0721, it's good stuff.\n— Nene Ayachi (mini)"
 LOADING_TIP_31: "What exactly is a galgame? Gal companies have studied this for years without fully grasping it.\nMaybe Yuzusoft had a pretty good approach, and made Senren＊Banka.\nBut later on, Yuzusoft's formula grew rigid too."
 LOADING_TIP_32: "Meguru is like the sun — wherever she shines, it's bright.\nNene is like the moon — different on the first and fifteenth.\n— A folk song from somewhere in Himematsu"
 LOADING_TIP_33: "I came here for 0721! What do you people want?!\n— Ayachi Nene, after being arrested at the Supernatural Research Club"
 LOADING_TIP_34: "Wherever Yoshino Tomotake's dark hand reaches, tatari-gami run rampant!\n— Ohitoyo documentary 'Irrefutable Evidence'"
 LOADING_TIP_35: "In a duel, the victor is whoever's detonator has one more bar of charge.\n— Ayachi Nene"
 LOADING_TIP_36: "I'd rather use the showerhead than a detonator.\n— Elwyn Kanna"
 LOADING_TIP_37: "Why is my body in such bad shape right now? It's a long story...\nMako's sleep interference is sonic — lying next to me, she emits sounds at night.\n— Yoshino Yoshihiro (pseud.)"
 LOADING_TIP_38: "Healing Wind~\n— Arihara Nanami"
 LOADING_TIP_39: "Although Hoshina Tohji committed the grave error of 'absorbing heart fragments' during the common route, looking at his life as a whole,\nhis indisputable contributions to Nene's happiness far outweigh his mistakes. His achievements come first,\nhis errors second. He is still held in reverence by Ayachi Nene."
 LOADING_TIP_40: "No one may ever know the true size of my boobs. If anyone does, my name is no longer Ayase — you may call me Zero-bust.\n— Mitsukasa Zero-bust"
 LOADING_TIP_41: "I know not with what weapons World War III will be fought, but World War IV will be fought with Yuzu and Yuzu attacking each other."
 LOADING_TIP_46: "My ministers all play Senren＊Banka, my queen plays Sabbat of the Witch, and my subjects play Riddle Joker.\n— Boris III"
 LOADING_TIP_47: "There are three kinds of lies: lies, damned lies, and 'I don't play Yuzusoft games.'\n— Mark Twain"
 LOADING_TIP_48: "We shall play galgames on the beaches, we shall play in the fields and in the streets. We shall never stop playing galgames.\n— Winston Churchill"
 LOADING_TIP_49: "The cause of Yuzu fans playing galgames shall never be halted by the bullet of any assassin.\n— Robert F. Kennedy"
 LOADING_TIP_50: "If a revolution breaks out, only heaven knows how it ends. I believe a constitutional regime spells the end of Russia. We need Yuzu fans!\n— Mikhail Tukhachevsky"
 LOADING_TIP_52: "Give me fifty yuan — I don't care if I miss Crazy Thursday.\n— Chiang Kai-shek (during the Senren＊Banka summer sale)"
 LOADING_TIP_53: "Dev team output blazes forth — the Yuzu Marshal takes command!\n— Yuzu General Staff propaganda slogan"
 LOADING_TIP_54: "The Yuzu mod is paradise, Group Leader Lao-ba is the bridge.\n— Yuzu General Staff propaganda slogan"
 LOADING_TIP_55: "Can Yoshino Tomotake become the heart of Ohitoyo's Great Purification?"
 LOADING_TIP_57: "The principles of Yuzusoft Galgaism, countless and complex, boil down to one single phrase — 'Moege is justified!' 'Moege is justified!'"
 LOADING_TIP_58: "Whatever decisions Mitsukasa Ayase makes, we must resolutely uphold; whatever instructions Mitsukasa Ayase gives, we must unswervingly follow."
 LOADING_TIP_59: "— This is Ohitoyo: As Told by Yoshino"
 LOADING_TIP_60: "Does adopting the Washizu model necessarily mean greater development, stability, and freedom? Many sparsely-populated regions copied Washizu's model — and what was the result? Political chaos, social instability, and Yuzu fans displaced."
 LOADING_TIP_61: "What, did that exceed your comprehension?\n— Mitsukasa Ayase, on the topic of her own bust"
 LOADING_TIP_62: "Nini~"
 LOADING_TIP_63: "May the Force be with you."
 LOADING_TIP_64: "Come on, folks — let's shoot the breeze."
 LOADING_TIP_65: "Now I am become Death, the destroyer of Steam Workshop — Ayachi Nene, after inventing the detonator"
 LOADING_TIP_66: "May the Force be with you."
 LOADING_TIP_67: "Don't worry — love knows no gender. I'll be rooting for you~ (evil grin)\n— Unohana no Sakuya-hime"
 LOADING_TIP_68: "Shall we do this by the book, or do you want me to just give you two punches?"
