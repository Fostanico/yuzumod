 tarot_the_chariot_name: "§YThe Chariot (Upright)§W\n\nUpright meaning: success through effort, victory, overcoming obstacles, action, independence, initiative, self-assertion, a young man, vehicles, excellent travel fortune.§!"
 tarot_the_chariot_down_name: "§YThe Chariot (Reversed)§W\n\nReversed meaning: defeat in arguments, disputes, obstruction, breaking rules, resorting to violence, a stubborn man, sudden failure, a delinquent youth, setbacks and selfishness.§!"
 tarot_the_sun_name: "§YThe Sun (Upright)§W\n\nUpright meaning: vitality, abundant life force, vigor, energy, smooth work, help from benefactors, a happy marriage, healthy social relations.§!"
 tarot_the_sun_down_name: "§YThe Sun (Reversed)§W\n\nReversed meaning: depression, poor physical condition, lack of continuity, low spirits, unstable life, poor interpersonal relations, emotional fluctuations, divorce.§!"
 tarot_death_name: "§YDeath (Upright)§W\n\nUpright meaning: failure, near ruin, illness, unemployment, stagnation, sustained damage, halted trade, a dull life, separation, a new beginning, a deep divide between two parties, the end of a romance.§!"
 tarot_death_down_name: "§YDeath (Reversed)§W\n\nReversed meaning: a glimmer of hope, revival from the brink, a change of heart, escaping a slump, restoring one's reputation, recovery of health, sudden changes of plan, escapism, cutting off a love affair, reunion with an old lover.§!"
 tarot_judgement_name: "§YJudgement (Upright)§W\n\nUpright meaning: the joy of resurrection, recovery, confession, good news, good luck, a first taste of success, rekindled love, reunion, the miracle of love.§!"
 tarot_judgement_down_name: "§YJudgement (Reversed)§W\n\nReversed meaning: utter collapse, disillusionment, concealment, bad news, indecision, lack of purpose, no progress, dissolution, lingering attachment.§!"
 tarot_justice_name: "§YJustice (Upright)§W\n\nUpright meaning: fairness, neutrality, honesty, an open mind, consistency inside and out, holding two positions, pursuing rationalization, a coordinator, matters of law, open and aboveboard dealings, harmonious affection.§!"
 tarot_justice_down_name: "§YJustice (Reversed)§W\n\nReversed meaning: imbalance, prejudice, turmoil, litigation, arbitrary decisions, a guilty conscience, unable to have both, duplicity, incompatible temperaments between a man and a woman, emotional upheaval, a romance that defies social morality.§!"
 tarot_strength_name: "§YStrength (Upright)§W\n\nUpright meaning: bold action, courageous decisions, new developments, a major turning point, changes, overcoming hardship through willpower, a robust woman.§!"
 tarot_strength_down_name: "§YStrength (Reversed)§W\n\nReversed meaning: timidity, losing to the strong, yielding to temptation, bowing to authority and convention, giving up before trying, vanity, cowardice, impatience.§!"
 tarot_temperrance_name: "§YTemperance (Upright)§W\n\nUpright meaning: simplicity, adjustment, smoothness, mutual benefit, fondness turning to love, pure love, deep love.§!"
 tarot_temperrance_down_name: "§YTemperance (Reversed)§W\n\nReversed meaning: exhaustion, decline, fatigue, loss, anxiety, disharmony, poor compatibility in love.§!"
 tarot_the_devil_name: "§YThe Devil (Upright)§W\n\nUpright meaning: bondage, degeneration, illness, malice, submission, a captive of desire, irresistible temptation, a decadent life, living on debt, a secret that must not be told, a hidden affair.§!"
 tarot_the_devil_down_name: "§YThe Devil (Reversed)§W\n\nReversed meaning: escaping restraint, relief from troubles, healing from illness, bidding farewell to the past, a pause, parting, refusing temptation, renouncing selfish desires, the moment of farewell, a love of love and hate.§!"
 tarot_the_emperor_name: "§YThe Emperor (Upright)§W\n\nUpright meaning: glory, power, victory, holding leadership, a strong will, achieving goals, a father's responsibility, spiritual solitude.§!"
 tarot_the_emperor_down_name: "§YThe Emperor (Reversed)\n\nReversed meaning: immaturity, powerlessness, tyranny, willfulness, mediocrity, lack of confidence, insufficient drive, weak will, being dominated.§!"
 tarot_the_empress_name: "§YThe Empress (Upright)§W\n\nUpright meaning: happiness, success, harvest, carefree contentment, a fulfilling family life, a favorable environment, beauty, art, contact with nature, pleasant travel, leisure.§!"
 tarot_the_empress_down_name: "§YThe Empress (Reversed)§W\n\nReversed meaning: listlessness, lack of ambition, slovenly habits, unresolved matters, no visible results, indulging in pleasure, a harsh environment, family disputes.§!"
 tarot_the_fool_name: "§YThe Fool (Upright)§W\n\nUpright meaning: longing for unspoiled places, walking without a destination, delighting in trying new things, wandering from place to place.§!"
 tarot_the_fool_down_name: "§YThe Fool (Reversed)§W\n\nReversed meaning: reckless action, pursuing possibilities, valuing dreams, disregarding material loss, leaving home, trusting others too much, troubled by travel plans, unable to travel with peace of mind, indecisiveness, eccentricity, impracticality.§!"
 tarot_the_hanged_man_name: "§YThe Hanged Man (Upright)§W\n\nUpright meaning: enduring trials, restricted action, sacrifice, undaunted by hardship, impervious to bribery, loss that brings gain, learning from experience, rebirth from fire, broad learning, selfless love.§!"
 tarot_the_hanged_man_down_name: "§YThe Hanged Man (Reversed)§W\n\nReversed meaning: futile sacrifice, fractures, bad luck, insufficient effort, being at a disadvantage, willfulness, selfishness, impatience, punishment, fleeing from love, a romance with no future.§!"
 tarot_the_hermit_name: "§YThe Hermit (Upright)§W\n\nUpright meaning: hidden facts, solitary action, listening to others' opinions, enjoying solitude, one's own plan, prudent vigilance, an elder, avoiding danger, a grandfather, country life.§!"
 tarot_the_hermit_down_name: "§YThe Hermit (Reversed)§W\n\nReversed meaning: ignoring warnings, hating solitude, inferiority, worry, childish thinking, failure from excessive caution, deviation, travel inadvisable.§!"
 tarot_the_hierophant_name: "§YThe Hierophant (Upright)§W\n\nUpright meaning: assistance, sympathy, magnanimity, advice from a trustworthy person, a good counselor, spiritual fulfillment, following the rules, volunteers.§!"
 tarot_the_hierophant_down_name: "§YThe Hierophant (Reversed)§W\n\nReversed meaning: misinformation, malicious counsel, being deceived, interrupted assistance, unfulfilled wishes, being used, being abandoned.§!"
 tarot_the_high_priestess_name: "§YThe High Priestess (Upright)§W\n\nUpright meaning: developing inner mysterious potential, a prophecy of change ahead, profound thinking, keen insight, accurate intuition.§!"
 tarot_the_high_priestess_down_name: "§YThe High Priestess (Reversed)§W\n\nReversed meaning: excessive fastidiousness, ignorance, greed, shortsightedness, excessive pride, skewed judgment, bold but foolish, self-importance.§!"
 tarot_the_lovers_name: "§YThe Lovers (Upright)§W\n\nUpright meaning: matchmaking, love, popularity, interest, a future full of hope, charm, gaining friends.§!"
 tarot_the_lovers_down_name: "§YThe Lovers (Reversed)§W\n\nReversed meaning: yielding to temptation, overindulgence, fickleness, fading friendship, boredom, quarrels, flashy attire, indecisiveness.§!"
 tarot_the_magician_name: "§YThe Magician (Upright)§W\n\nUpright meaning: the beginning of things, a change of action, skilled techniques and craftsmanship, carrying out one's will, using the forces of nature to achieve ambition.§!"
 tarot_the_magician_down_name: "§YThe Magician (Reversed)§W\n\nReversed meaning: weak willpower, a difficult start, heading in the wrong direction, insufficient knowledge, being deceived and failing.§!"
 tarot_the_moon_name: "§YThe Moon (Upright)§W\n\nUpright meaning: anxiety, confusion, wavering, lies, deception, infatuation, turbulent love, love triangles.§!"
 tarot_the_moon_down_name: "§YThe Moon (Reversed)§W\n\nReversed meaning: escaping a scam, clearing up misunderstandings, improving circumstances, foreseeing danger, waiting, facing the cracks in love.§!"
 tarot_the_star_name: "§YThe Star (Upright)§W\n\nUpright meaning: a bright future, full of hope, imagination, creativity, fantasy, wishes fulfilled, rising standards, an ideal partner, a wonderful romance.§!"
 tarot_the_star_down_name: "§YThe Star (Reversed)§W\n\nReversed meaning: setbacks, disappointment, aiming too high, wishful thinking, panic and confusion, things going against one's wishes, unsatisfying work, a pessimistic outlook, a secret romance, a life lacking love.§!"
 tarot_the_tower_name: "§YThe Tower (Upright)§W\n\nUpright meaning: bankruptcy, adversity, dismissal, sudden illness, a fatal blow, tremendous upheaval, being implicated, the collapse of faith, playing with fire, endless turmoil, sudden separation, shattered love.§!"
 tarot_the_tower_down_name: "§YThe Tower (Reversed)§W\n\nReversed meaning: difficulty, internal strife, a pressing situation, poor conditions, moving toward stability, arrogance will be paid for, a last stand, a premonition of separation, a crisis in love.§!"
 tarot_the_world_name: "§YThe World (Upright)§W\n\nUpright meaning: completion, success, perfection, continuity, elation, a lifelong goal, fulfilling one's mission, fortune descending, a joyful ending, model lovers.§!"
 tarot_the_world_down_name: "§YThe World (Reversed)§W\n\nReversed meaning: incompletion, failure, insufficient preparation, blind acceptance, temporary setbacks, giving up halfway, spiritual decline, saturation, conspiracy, incompatible attitudes, emotional frustration.§!"
 tarot_wheel_of_fortune_name: "§YWheel of Fortune (Upright)§W\n\nUpright meaning: pivotal events, new opportunities, currents of fate, changes in circumstances, a fortunate beginning, improving conditions, problems solved, the goddess of fortune descends.§!"
 tarot_wheel_of_fortune_down_name: "§YWheel of Fortune (Reversed)§W\n\nReversed meaning: persistent misfortune, setbacks, plans falling through, obstacles, unable to correct course, things turning for the worse, a vicious cycle, interruption.§!"


 #塔罗牌描述
 tarot_the_chariot_name_desc: "§9This card depicts the kingly chariot that overcomes obstacles and wins victory. The victor on the card stands upon the chariot in a powerful pose, displaying his great achievements in the mortal world. A black lion and a white lion pull the chariot, ever ready to press onward.\n\nThis card is a symbol of the strong; it is closely tied to strength, meaning success won through perseverance. \"Never give up\" is the theme of this card. No matter how many hardships lie ahead, you must keep going, and in doing so you will come to command the fate of yourself and all around you. The victor on the chariot symbolizes the human soul; controlling the two lions symbolizes human will and instinct traveling through time.§!"
 tarot_the_chariot_down_name_desc: "§9This card depicts the kingly chariot that overcomes obstacles and wins victory. The victor on the card stands upon the chariot in a powerful pose, displaying his great achievements in the mortal world. A black lion and a white lion pull the chariot, ever ready to press onward.\n\nThis card is a symbol of the strong; it is closely tied to strength, meaning success won through perseverance. \"Never give up\" is the theme of this card. No matter how many hardships lie ahead, you must keep going, and in doing so you will come to command the fate of yourself and all around you. The victor on the chariot symbolizes the human soul; controlling the two lions symbolizes human will and instinct traveling through time.§!"
 tarot_the_sun_name_desc: "§9This is the most auspicious card in the Major Arcana, symbolizing knowledge and vitality. On the card, a child rides a horse, praising the life force brought by the sun and receiving the energy it grants. The sun's power is so great that it gives life to all things; its light is so warm that all living beings are moved by it. Its power is entirely positive, full of hope and ideals, and no darkness can withstand its light.\n\nThe key to reading this card lies in \"vitality.\" It is the power of hope and ideals, undisturbed by any external interference or internal conflict. Even if a dark side within tries to disturb you, it vanishes instantly under the sun's light, so do not let worries trouble you.§!"
 tarot_the_sun_down_name_desc: "§9This is the most auspicious card in the Major Arcana, symbolizing knowledge and vitality. On the card, a child rides a horse, praising the life force brought by the sun and receiving the energy it grants. The sun's power is so great that it gives life to all things; its light is so warm that all living beings are moved by it. Its power is entirely positive, full of hope and ideals, and no darkness can withstand its light.\n\nThe key to reading this card lies in \"vitality.\" It is the power of hope and ideals, undisturbed by any external interference or internal conflict. Even if a dark side within tries to disturb you, it vanishes instantly under the sun's light, so do not let worries trouble you.§!"
 tarot_death_name_desc: "§9This is the most misunderstood card in the Major Arcana. In Western religious thought, the number thirteen has always been associated with death — as is the case with this card. The Reaper rides a white horse clad in armor, displaying his unstoppable power. Some have already fallen; some accept the cruel reality; some try to look away; and some put up a futile resistance.\n\nAccording to the ancient calendar, the thirteenth month is the month of death and rebirth, so you should not read the card literally but interpret it in a positive sense. Accept the facts before you, let go of some gains already in hand, and you may receive even richer returns. As the saying goes, \"survive the deadliest of situations and new life begins\" — after trials, success will be even greater.§!"
 tarot_death_down_name_desc: "§9This is the most misunderstood card in the Major Arcana. In Western religious thought, the number thirteen has always been associated with death — as is the case with this card. The Reaper rides a white horse clad in armor, displaying his unstoppable power. Some have already fallen; some accept the cruel reality; some try to look away; and some put up a futile resistance.\n\nAccording to the ancient calendar, the thirteenth month is the month of death and rebirth, so you should not read the card literally but interpret it in a positive sense. Accept the facts before you, let go of some gains already in hand, and you may receive even richer returns. As the saying goes, \"survive the deadliest of situations and new life begins\" — after trials, success will be even greater.§!"
 tarot_judgement_name_desc: "§9The card depicts an angel blowing a trumpet, granting redemption to the dead who hear the music. The angel's trumpet can awaken everyone's emotions; even repentant sinners have hope of reaching heaven. The angel's call symbolizes that old ideas have died and that people are embracing a new world at the music's summons. When reading this card, pay attention to decision and recovery.\n\nYou, too, are reviewing and organizing past experience, discarding mistakes and keeping precious knowledge. At the start of the new world, you will find yourself not alone — many friends are learning alongside you. Though you may be strangers, the holy angel makes you help one another, making your lives more pleasant.§!"
 tarot_judgement_down_name_desc: "§9The card depicts an angel blowing a trumpet, granting redemption to the dead who hear the music. The angel's trumpet can awaken everyone's emotions; even repentant sinners have hope of reaching heaven. The angel's call symbolizes that old ideas have died and that people are embracing a new world at the music's summons. When reading this card, pay attention to decision and recovery.\n\nYou, too, are reviewing and organizing past experience, discarding mistakes and keeping precious knowledge. At the start of the new world, you will find yourself not alone — many friends are learning alongside you. Though you may be strangers, the holy angel makes you help one another, making your lives more pleasant.§!"
 tarot_justice_name_desc: "§9The card depicts the cold and impartial goddess of justice seated upon a stone throne, holding a sword of justice in her right hand and a scale that discerns good and evil in her left. With these two sacred instruments, the goddess can easily understand the full course of events and their future development, letting her face all before her with ease. She also teaches the world the principle of cause and effect, warning people to be tolerant, abide by morality, and uphold justice.§!"
 tarot_justice_down_name_desc: "§9The card depicts the cold and impartial goddess of justice seated upon a stone throne, holding a sword of justice in her right hand and a scale that discerns good and evil in her left. With these two sacred instruments, the goddess can easily understand the full course of events and their future development, letting her face all before her with ease. She also teaches the world the principle of cause and effect, warning people to be tolerant, abide by morality, and uphold justice.§!"
 tarot_strength_name_desc: "§9On this card, the goddess of victory bends down to stroke a fierce lion, soothing with her gentleness and love the lion that represents fear in her arms — it is a symbol of love and strong will. It is precisely because of love and will that humanity can overcome hardship and keep advancing through the river of history. The lion represents human instinct, while the beauty symbolizes love and submission; the two must remain in harmony and support each other to become a power that conquers the world. The card also means you have the ability to resolve the difficulties before you and to have confidence in your inner strength.\n\nWhen reading this card, note the balance of \"firmness and gentleness.\" Human instinct is fearful and needs reason to control and comfort it; yet one must not lose the drive of instinct, and reason must also give encouragement. From this, one can see that \"balance\" is the most important thing in tarot interpretation.§!"
 tarot_strength_down_name_desc: "§9On this card, the goddess of victory bends down to stroke a fierce lion, soothing with her gentleness and love the lion that represents fear in her arms — it is a symbol of love and strong will. It is precisely because of love and will that humanity can overcome hardship and keep advancing through the river of history. The lion represents human instinct, while the beauty symbolizes love and submission; the two must remain in harmony and support each other to become a power that conquers the world. The card also means you have the ability to resolve the difficulties before you and to have confidence in your inner strength.\n\nWhen reading this card, note the balance of \"firmness and gentleness.\" Human instinct is fearful and needs reason to control and comfort it; yet one must not lose the drive of instinct, and reason must also give encouragement. From this, one can see that \"balance\" is the most important thing in tarot interpretation.§!"
 tarot_temperrance_name_desc: "§9The card depicts an angel holding a chalice in each hand — the two cups representing \"matter\" and \"spirit.\" She pours water back and forth between them, trying to keep the water in the two cups balanced. It warns us that when facing all kinds of temptations, controlling one's desires is the most important thing. Unlike other cards, it holds no joy or success; it lets us feel a kind of plain beauty — after all, a plain life is true happiness.\nIt also represents that a person's ability is composed of both the knowledge they master and their understanding of that knowledge. Everything should be done with purpose; through these things we mature, and our careers develop.§!"
 tarot_temperrance_down_name_desc: "§9The card depicts an angel holding a chalice in each hand — the two cups representing \"matter\" and \"spirit.\" She pours water back and forth between them, trying to keep the water in the two cups balanced. It warns us that when facing all kinds of temptations, controlling one's desires is the most important thing. Unlike other cards, it holds no joy or success; it lets us feel a kind of plain beauty — after all, a plain life is true happiness.\nIt also represents that a person's ability is composed of both the knowledge they master and their understanding of that knowledge. Everything should be done with purpose; through these things we mature, and our careers develop.§!"
 tarot_the_devil_name_desc: "§9The Devil watches the slaves bound by iron chains and sneers with satisfaction. Though the slaves are chained, they could break free of the Devil if they helped one another — but their eyes are already blinded by the Devil's temptation, and they willingly serve him. Look closely: they have already grown horns and tails like the Devil's.\nThe hideous Devil has such a sweet voice, luring people into slavery with money and so-called security. Under his control, people lose the ability to communicate with one another, and what fills their hearts is nothing but naked primal desire. In pursuit of money, they deny every other goal in life; people become selfish and greedy. Yet when life ends, these material things no longer hold any meaning.\nThe Devil represents a mistaken belief — that possessing material wealth means possessing everything. External interference lets impulse rule over reason, one's spiritual demands keep fading, and one begins to refuse responsibility for one's own actions, because all faults can be blamed on the Devil. This can also be seen as success in one's career, since your ultimate goal is money.§!"
 tarot_the_devil_down_name_desc: "§9The Devil watches the slaves bound by iron chains and sneers with satisfaction. Though the slaves are chained, they could break free of the Devil if they helped one another — but their eyes are already blinded by the Devil's temptation, and they willingly serve him. Look closely: they have already grown horns and tails like the Devil's.\nThe hideous Devil has such a sweet voice, luring people into slavery with money and so-called security. Under his control, people lose the ability to communicate with one another, and what fills their hearts is nothing but naked primal desire. In pursuit of money, they deny every other goal in life; people become selfish and greedy. Yet when life ends, these material things no longer hold any meaning.\nThe Devil represents a mistaken belief — that possessing material wealth means possessing everything. External interference lets impulse rule over reason, one's spiritual demands keep fading, and one begins to refuse responsibility for one's own actions, because all faults can be blamed on the Devil. This can also be seen as success in one's career, since your ultimate goal is money.§!"
 tarot_the_emperor_name_desc: "§9The supreme emperor sits upon his throne, wearing a crown set with jewels and holding in his hands the scepter that symbolizes power and status. His face is grave with experience; even as the sovereign of a nation, he still wears armor, ever ready to meet challenges for his country.\nHe rules the entire nation with unquestionable majesty; he is the leader of his people and the symbol of masculine authority. Yet behind his imposing exterior lies a kind heart. He is passionate and willing to share the secrets of his success with those who seek his counsel. His secret lies in relying on his mind and the experience accumulated through past struggle. His advice, too, comes mostly from that precious experience — as worthy of your trust as his upright character.\nBut is an emperor who can command a nation necessarily happy? When reading this card, never overlook this point, because what most querents hope for is joy of the heart, even if they themselves may not realize it. What kind of inner world lies behind the imposing facade is often the key.\nAs the sovereign of a nation, he is also a model for fathers — otherwise, how could he instruct his subjects?§!"
