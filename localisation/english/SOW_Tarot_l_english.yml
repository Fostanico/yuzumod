 tarot_the_empress_name_desc: "§9The beautiful empress sits upon an elegant, comfortable chair, surrounded by a dense forest that brings a feeling of carefree ease. Beside the chair rests a heart, as if she intends to grant you these fertile lands and fruits — a complete love. It would be fitting to give thanks.§!"
 tarot_the_empress_down_name_desc: "§9The beautiful empress sits upon an elegant, comfortable chair, surrounded by a dense forest that brings a feeling of carefree ease. Beside the chair rests a heart, as if she intends to grant you these fertile lands and fruits — a complete love. It would be fitting to give thanks.§!"
 tarot_the_fool_name_desc: "§9The first card of the Major Arcana is the Fool. \"0\" signifies nothing — as if knowing nothing, yet as if containing greater potential than any other position. This card has no particular place in the sequence; it does not fall within the order of 1-21, making it a rather special card. That it is 0 may also mean it is the beginning or the end of all things. One theory holds that it is the prototype of the joker in playing cards.\n1. With light steps, no obstacle on the ground can restrain him. A young man in splendid clothes walks along the edge of a cliff, his ideal in his eyes. In his left hand he holds a rose; in his right, all his belongings (a bundle), wandering wherever he goes. His expression is full of wit and dreams. The dog beside him reminds him not to charge blindly ahead but to stop and think. The staff supporting the bundle symbolizes the power of will; the little dog is a hint of crisis.\n2. The laurel wreath represents victory. The rose represents the desire to pursue new things. The colorful clothes represent worldly matters that cannot be easily cast aside. The red feather represents a pure heart. The bundle represents inner impact. The staff represents the Fool facing a new journey full of strength and vitality.\n3. He wears an ornate headdress and carries a staff on his shoulder; reflected in his eyes is his utopia. Realists call him arrogant; idealists see in him an adventurous spirit.§!"
 tarot_the_fool_down_name_desc: "§9The first card of the Major Arcana is the Fool. \"0\" signifies nothing — as if knowing nothing, yet as if containing greater potential than any other position. This card has no particular place in the sequence; it does not fall within the order of 1-21, making it a rather special card. That it is 0 may also mean it is the beginning or the end of all things. One theory holds that it is the prototype of the joker in playing cards.\n1. With light steps, no obstacle on the ground can restrain him. A young man in splendid clothes walks along the edge of a cliff, his ideal in his eyes. In his left hand he holds a rose; in his right, all his belongings (a bundle), wandering wherever he goes. His expression is full of wit and dreams. The dog beside him reminds him not to charge blindly ahead but to stop and think. The staff supporting the bundle symbolizes the power of will; the little dog is a hint of crisis.\n2. The laurel wreath represents victory. The rose represents the desire to pursue new things. The colorful clothes represent worldly matters that cannot be easily cast aside. The red feather represents a pure heart. The bundle represents inner impact. The staff represents the Fool facing a new journey full of strength and vitality.\n3. He wears an ornate headdress and carries a staff on his shoulder; reflected in his eyes is his utopia. Realists call him arrogant; idealists see in him an adventurous spirit.§!"
 tarot_the_hanged_man_name_desc: "§9This card symbolizes self-sacrifice. It depicts a warrior hanged upside down with his hands bound behind his back; a faint angelic halo has already appeared above his head. Though others consider this utterly painful, his face is serene, because he knows he is sacrificing himself for others — even if his body is destroyed, his spirit will endure.\nThis card tells us that even the worst circumstances are merely a trial for us, and misfortune will always pass. As in the legend of the phoenix reborn from ashes, or Odin in Norse mythology, who hung himself on the gallows to learn magic, writing, spells, and poetry. Enduring present misfortune, accepting the arrangements of fate, reflecting carefully on past gains and losses, and storing up strength for a future rise are what matters most.§!"
 tarot_the_hanged_man_down_name_desc: "§9This card symbolizes self-sacrifice. It depicts a warrior hanged upside down with his hands bound behind his back; a faint angelic halo has already appeared above his head. Though others consider this utterly painful, his face is serene, because he knows he is sacrificing himself for others — even if his body is destroyed, his spirit will endure.\nThis card tells us that even the worst circumstances are merely a trial for us, and misfortune will always pass. As in the legend of the phoenix reborn from ashes, or Odin in Norse mythology, who hung himself on the gallows to learn magic, writing, spells, and poetry. Enduring present misfortune, accepting the arrangements of fate, reflecting carefully on past gains and losses, and storing up strength for a future rise are what matters most.§!"
 tarot_the_hermit_name_desc: "§9The hermit, robed in a long cloak, carries a lamp and leans on a staff, groping his way alone through the darkness. This card represents solitude. The hermit tries to abandon external temptations to achieve inner peace, and in the silence attains truth through meditation. In the stillness, only the voice of one's own heart can be heard, so one can better understand one's own thoughts and find a final goal that truly belongs to oneself.§!"
 tarot_the_hermit_down_name_desc: "§9The hermit, robed in a long cloak, carries a lamp and leans on a staff, groping his way alone through the darkness. This card represents solitude. The hermit tries to abandon external temptations to achieve inner peace, and in the silence attains truth through meditation. In the stillness, only the voice of one's own heart can be heard, so one can better understand one's own thoughts and find a final goal that truly belongs to oneself.§!"
 tarot_the_hierophant_name_desc: "§9He is the supreme authority in religion and spiritual faith. He always finds an outlet for our hearts, and his compassion and virtue will surely keep us from going astray, guiding us onto the path of recognizing our conscience and seeing that today is right and yesterday was wrong. Especially when you feel guilty at heart, he is always glad to listen quietly to your confession.\nThis is a card that awakens conscience and goodness, and a card about religious faith and tradition. Compared with the material dominion represented by the Emperor, he leans more toward the spiritual plane; he is an authority of the spirit and an interpreter of the unknown world. Because the Pope can communicate directly with God, he uses compassion and insight to try to save people's souls, and uses his words to guide people to the right path.\nOn the card, the Pope raises both hands to spread his teachings to the world, while the faithful kneel devoutly on the ground to listen. Yet note that he is also the representative of traditional knowledge and conservative morality; he controls people's thinking and narrows their horizons. Only by completely abandoning the stale and exploring new solutions may there be hope.§!"
 tarot_the_hierophant_down_name_desc: "§9He is the supreme authority in religion and spiritual faith. He always finds an outlet for our hearts, and his compassion and virtue will surely keep us from going astray, guiding us onto the path of recognizing our conscience and seeing that today is right and yesterday was wrong. Especially when you feel guilty at heart, he is always glad to listen quietly to your confession.\nThis is a card that awakens conscience and goodness, and a card about religious faith and tradition. Compared with the material dominion represented by the Emperor, he leans more toward the spiritual plane; he is an authority of the spirit and an interpreter of the unknown world. Because the Pope can communicate directly with God, he uses compassion and insight to try to save people's souls, and uses his words to guide people to the right path.\nOn the card, the Pope raises both hands to spread his teachings to the world, while the faithful kneel devoutly on the ground to listen. Yet note that he is also the representative of traditional knowledge and conservative morality; he controls people's thinking and narrows their horizons. Only by completely abandoning the stale and exploring new solutions may there be hope.§!"
 tarot_the_high_priestess_name_desc: "§9A wise person or woman may make a good decision. This holy priestess sits upright, holding a scroll in her hands, proving that she is full of wisdom — rest assured and leave the decision to her.§!"
 tarot_the_high_priestess_down_name_desc: "§9A wise person or woman may make a good decision. This holy priestess sits upright, holding a scroll in her hands, proving that she is full of wisdom — rest assured and leave the decision to her.§!"
 tarot_the_lovers_name_desc: "§9This is the best card in the tarot for interpreting love, representing the springtime of life. On the card, a man and a woman come together at an angel's summons and become lovers. Though the sun shines brightly and happiness fills the air, many trials await the lovers behind them — the tree of hope and the forbidden tree coiled with serpents.\nLovers can assist and support each other, and romance becomes the theme of this beautiful time. But those in love must face an emotional choice — choosing one among many as a partner. Love is thus both beautiful and cruel. When reading this card, be sure to note the \"choice\" behind the \"union\" — one must weigh and decide.§!"
 tarot_the_lovers_down_name_desc: "§9This is the best card in the tarot for interpreting love, representing the springtime of life. On the card, a man and a woman come together at an angel's summons and become lovers. Though the sun shines brightly and happiness fills the air, many trials await the lovers behind them — the tree of hope and the forbidden tree coiled with serpents.\nLovers can assist and support each other, and romance becomes the theme of this beautiful time. But those in love must face an emotional choice — choosing one among many as a partner. Love is thus both beautiful and cruel. When reading this card, be sure to note the \"choice\" behind the \"union\" — one must weigh and decide.§!"
 tarot_the_magician_name_desc: "§91. The card depicts Mercury, the messenger god of Roman mythology, with a confident smile and bright, piercing eyes. On the table are the four elements of the universe: the wand (fire), the sword (wind), the pentacle (earth), and the cup (water). Above the Magician's head is a symbol of infinity; his belt is a snake biting its own tail, a symbol of the eternity of spirit. The Magician points his right hand with the wand to the sky and his left hand to the ground, representing the exchange of power and the giving of spirit. Beneath the Magician's feet are roses and lilies, representing human motives, reflecting the will of the gods and commanding heaven and earth. The rose represents life; the lily represents death. As the first card, the Magician also hints that you yourself are a magician, able to command the power of the universe.\n2. The white robe represents a pure heart; the deep red cloak represents the profound significance of the Magician's deeds.§!"
 tarot_the_magician_down_name_desc: "§91. The card depicts Mercury, the messenger god of Roman mythology, with a confident smile and bright, piercing eyes. On the table are the four elements of the universe: the wand (fire), the sword (wind), the pentacle (earth), and the cup (water). Above the Magician's head is a symbol of infinity; his belt is a snake biting its own tail, a symbol of the eternity of spirit. The Magician points his right hand with the wand to the sky and his left hand to the ground, representing the exchange of power and the giving of spirit. Beneath the Magician's feet are roses and lilies, representing human motives, reflecting the will of the gods and commanding heaven and earth. The rose represents life; the lily represents death. As the first card, the Magician also hints that you yourself are a magician, able to command the power of the universe.\n2. The white robe represents a pure heart; the deep red cloak represents the profound significance of the Magician's deeds.§!"
 tarot_the_moon_name_desc: "§9This is a card of confusion, hardship, and anxiety. Under the moonlight, a crayfish crawls out of the water and walks toward the moon goddess. It must choose the correct one of two distant towers, for that tower is the only path to an audience with the moon goddess. The wolf and the hound on the shore, likewise drawn by the moon goddess, have not yet noticed the crayfish close at hand. The dog represents the crayfish's dependence on the old world, while the wolf represents its fear.\nThe moon is a bridge to the spiritual world; the waxing and waning of the moon symbolizes change. When the full moon appears, people know it will soon wane, and unease wells up within them. The larger the moon, the closer it is to shrinking — worrying about misfortune while happy makes people feel they cannot afford any slack.\nThe moon is also a symbol of womanhood and emotion; in career matters it indicates an artistic or creative pursuit, and it also hints at deception. The key to reading this card lies in \"confusion.\"§!"
 tarot_the_moon_down_name_desc: "§9This is a card of confusion, hardship, and anxiety. Under the moonlight, a crayfish crawls out of the water and walks toward the moon goddess. It must choose the correct one of two distant towers, for that tower is the only path to an audience with the moon goddess. The wolf and the hound on the shore, likewise drawn by the moon goddess, have not yet noticed the crayfish close at hand. The dog represents the crayfish's dependence on the old world, while the wolf represents its fear.\nThe moon is a bridge to the spiritual world; the waxing and waning of the moon symbolizes change. When the full moon appears, people know it will soon wane, and unease wells up within them. The larger the moon, the closer it is to shrinking — worrying about misfortune while happy makes people feel they cannot afford any slack.\nThe moon is also a symbol of womanhood and emotion; in career matters it indicates an artistic or creative pursuit, and it also hints at deception. The key to reading this card lies in \"confusion.\"§!"
 tarot_the_star_name_desc: "§9This is a card with hope hidden in its depths. Under the light of Sirius, the star of hope, the goddess of hope pours holy water from her sacred vessel into a pool that symbolizes the subconscious. She knows how desperately people need hope, so when one vessel is emptied, she pours from another. Only with hope can people find enough motivation to accomplish many things — hope is thus the source of humanity's vitality.\nLet us offer all our love. Though it is night, the sky full of stars shows us the way, and guided by starlight we walk toward a bright future. One more meaning of the star is easily overlooked: \"pregnancy.\"§!"
 tarot_the_star_down_name_desc: "§9This is a card with hope hidden in its depths. Under the light of Sirius, the star of hope, the goddess of hope pours holy water from her sacred vessel into a pool that symbolizes the subconscious. She knows how desperately people need hope, so when one vessel is emptied, she pours from another. Only with hope can people find enough motivation to accomplish many things — hope is thus the source of humanity's vitality.\nLet us offer all our love. Though it is night, the sky full of stars shows us the way, and guided by starlight we walk toward a bright future. One more meaning of the star is easily overlooked: \"pregnancy.\"§!"
 tarot_the_tower_name_desc: "§9This is the only Major Arcana card whose upright and reversed positions both carry ill omens. A tower rising into the clouds is struck down by lightning, and two people fall from the collapsing tower to the ground. The sudden and unpredictable upheaval is hard to accept; no matter how proud humanity is, it cannot compare with the might of nature, and challenging nature only invites the gods' wrath.\nThough this great change is hard to adapt to, it is teaching you to grow. Try to accept it — it will let you walk more easily in the days ahead. Accepting the fact that your opponent is strong is indeed difficult, but facing it pragmatically and resolving it rationally is also a great step forward.§!"
 tarot_the_tower_down_name_desc: "§9This is the only Major Arcana card whose upright and reversed positions both carry ill omens. A tower rising into the clouds is struck down by lightning, and two people fall from the collapsing tower to the ground. The sudden and unpredictable upheaval is hard to accept; no matter how proud humanity is, it cannot compare with the might of nature, and challenging nature only invites the gods' wrath.\nThough this great change is hard to adapt to, it is teaching you to grow. Try to accept it — it will let you walk more easily in the days ahead. Accepting the fact that your opponent is strong is indeed difficult, but facing it pragmatically and resolving it rationally is also a great step forward.§!"
 tarot_the_world_name_desc: "§9This is a card symbolizing permanent and lasting success. You have arrived before the gate of success. The goddess of success asks you to wait patiently — she will let you enter the gate; it is only a matter of time. Around the gate of success are the happiness and sorrow, success and failure you have experienced. Before reaching the promised land, it is worthwhile to recall the past. This card suggests that as long as you have a grateful heart, you will surely find happiness and joy in the beautiful world you have built for yourself.\nThe card's original meaning is \"achievement.\" It tells us that all things can be achieved, all dreams can become reality, and nothing is unobtainable. As long as you cultivate, you will reap accordingly.§!"
 tarot_the_world_down_name_desc: "§9This is a card symbolizing permanent and lasting success. You have arrived before the gate of success. The goddess of success asks you to wait patiently — she will let you enter the gate; it is only a matter of time. Around the gate of success are the happiness and sorrow, success and failure you have experienced. Before reaching the promised land, it is worthwhile to recall the past. This card suggests that as long as you have a grateful heart, you will surely find happiness and joy in the beautiful world you have built for yourself.\nThe card's original meaning is \"achievement.\" It tells us that all things can be achieved, all dreams can become reality, and nothing is unobtainable. As long as you cultivate, you will reap accordingly.§!"
 tarot_wheel_of_fortune_name_desc: "§9On the card, above the Wheel of Fortune sits the sphinx symbolizing an angel, below it the devil, and around it the goddesses, swans, serpents, and other symbols of the various circumstances of fate. Your fortune is like that wheel, turning ceaselessly in the tarot — sometimes good, sometimes bad; this is a fair cycle. The wheel may stop at an angle you like, granting you incredible luck; or it may stop at an angle you dislike, bringing you misfortune. Whether you like it or not, fate is merciless, and life itself is in constant change, filling your life with challenges and excitement.§!"
